            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/model.v1.CreateModelSuperRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/model.v1.Model'
    /v1/models/platform/update:
        put:
            tags:
                - ModelService
            description: UpdateModelSuper 覆盖平台模型行可变字段（super 写面）。
            operationId: ModelService_UpdateModelSuper
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/model.v1.UpdateModelSuperRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/model.v1.Model'
    /v1/models/platform/{id}:
        delete:
            tags:
                - ModelService
            description: DeleteModelSuper 软删除平台模型行（super 写面）。
            operationId: ModelService_DeleteModelSuper
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/models/update:
        put:
            tags:
                - ModelService
            description: UpdateModel 覆盖本租户模型行的可变字段。
            operationId: ModelService_UpdateModel
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/model.v1.UpdateModelRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/model.v1.Model'
    /v1/models/{id}:
        get:
            tags:
                - ModelService
            description: GetModel 按 id 查询模型（本租户行或平台行）。
            operationId: ModelService_GetModel
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/model.v1.Model'
        delete:
            tags:
                - ModelService
            description: DeleteModel 软删除本租户模型行。
            operationId: ModelService_DeleteModel
            parameters:
                - name: id
