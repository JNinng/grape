      - "queries/perm.sql"
      - "queries/sys_user.sql"
      - "queries/assign_options.sql"
      - "queries/sys_dept.sql"
      - "queries/sys_user_group.sql"
      - "queries/sys_dict.sql"
      - "queries/sys_audit_log.sql"
      - "queries/sys_role.sql"
      - "queries/menu.sql"
      - "queries/sys_session.sql"
      - "queries/agent_audit.sql"
      - "queries/agent_grant.sql"
      - "queries/agent_retrieval_log.sql"
