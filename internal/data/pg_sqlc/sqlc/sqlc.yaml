      - "schema/91_knowledge.sql"
      - "schema/92_model.sql"
      - "schema/93_oss.sql"
      - "schema/95_agent_audit.sql"
      - "rls.sql"
      - "operate.sql"
      - "expose.sql"
      - "96_agent_grant.sql"
      - "schema/97_agent_retrieval_log.sql"
      - "schema/99_model_call_log.sql"
      - "98_menu_write.sql"
      - "98_config_write.sql"
      - "98_model_write.sql"
      - "98_tenant_guard.sql"
    queries:
