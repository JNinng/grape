                    description: 本节点的部门。
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.DeptTreeNode'
                    description: 直接子节点。
            description: |-
                DeptTreeNode 是 GetDeptTree 返回的树节点：部门与其子树。children 按部门
                 创建时间升序排列（同刻按 id 升序），与叶子平铺顺序一致。
        org.v1.DeptTreeReply:
