                 部分）。过滤表达式非法、字段未知、操作符不允许、条件冲突、跨表
                 游标均返回 INVALID_ARGUMENT。
            operationId: TenantService_ListTenantsSuper
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/query.v1.Query'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/tenant.v1.TenantSet'
    /v1/tenants/update:
        put:
            tags:
                - TenantService
            description: |-
                UpdateTenantSuper 覆盖可变字段（status、name、contact_name、
                 contact_phone、expired_at、max_user_count、default_locale）。id 与
                 tenant_id 只读；code 是身份列（创建后不可变），parent_id 是结构列
                 （创建后不可变），两者在更新输入中被忽略。name 冲突返回
                 ALREADY_EXISTS；目标不存在、已软删或树外不可见返回 NOT_FOUND。
                 调用方自身租户的 status 变更（与当前值不同）返回 INVALID_ARGUMENT
                 ——自身停用/恢复须走 Disable/Restore；同值更新（如只改 name）放行。
            operationId: TenantService_UpdateTenantSuper
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/tenant.v1.Tenant'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/tenant.v1.Tenant'
    /v1/tenants/{id}:
        get:
            tags:
                - TenantService
            description: |-
                GetTenantSuper 按 id 查询单个租户。目标不存在、已软删或不在调用方
                 租户树内（RLS 不可见）均返回 NOT_FOUND。
            operationId: TenantService_GetTenantSuper
            parameters:
                - name: id
                  in: path
                  description: 目标租户的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/tenant.v1.Tenant'
        delete:
            tags:
                - TenantService
            description: |-
                DeleteTenantSuper 软删除租户（deleted_at 置位）。存在未删除的直接
                 子租户时拒绝（TENANT_HAS_CHILDREN，需自叶向根逐层删）；禁止删除
                 调用方自身租户（INVALID_ARGUMENT）。目标不存在、已软删或树外
                 不可见返回 NOT_FOUND。
            operationId: TenantService_DeleteTenantSuper
            parameters:
                - name: id
                  in: path
                  description: 目标租户的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
