                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。服务端生成，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。服务端生成，只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间，通常为空。只读。
                    format: date-time
            description: Dept 是部门的规范表示。审计列与时间戳只读；闭包路径不出现在任何接口。
        org.v1.DeptSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.Dept'
                    description: 本页部门，顺序遵循查询中的 sort。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现。
                hasMore:
                    type: boolean
                    description: 是否还有后续页。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0。
                    format: int32
            description: DeptSet 是 ListDepts 返回的分页集合。
