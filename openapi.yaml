                                $ref: '#/components/schemas/perm.v1.Role'
    /v1/roles/{id}:
        get:
            tags:
                - RoleService
            description: GetRole 按 id 查询单个角色。跨租户不可见等同不存在（NOT_FOUND）。
            operationId: RoleService_GetRole
            parameters:
                - name: id
                  in: path
                  description: 目标角色的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/perm.v1.Role'
        delete:
            tags:
                - RoleService
            description: |-
                DeleteRole 软删除角色（deleted_at 置位）。系统预置角色（role_type=1）
                 返回 PRESET_UNDELETABLE。数据范围明细、分发部门与角色-菜单映射行随
                 物理保留：消费侧（数据范围推导、分配判定、功能权限判定）都联结角色表
                 启用且未删除过滤，残留行不产生可见副作用。
            operationId: RoleService_DeleteRole
            parameters:
                - name: id
                  in: path
                  description: 目标角色的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/roles/{id}/data-scope:
        get:
            tags:
                - RoleService
            description: |-
                GetRoleDataScope 读取角色的数据范围配置（data_scope、scope_dept_id、
                 ID 范围明细与分发部门集合）。角色不存在或跨租户返回 NOT_FOUND。
            operationId: RoleService_GetRoleDataScope
            parameters:
                - name: id
                  in: path
                  description: 目标角色的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/perm.v1.RoleDataScope'
        put:
            tags:
                - RoleService
            description: |-
                SetRoleDataScope 设置角色的数据范围配置，整组替换：data_scope 与
                 scope_dept_id 随角色行更新；ID 范围明细与分发部门按传入集合差量同步
                 （移除不在集合内的行——物理删除，补建缺失条目，既有命中行保留原审计）。
                 明细与分发部门引用的对象必须存在且启用（跨租户等同不存在），任一未知
                 返回 INVALID_ARGUMENT 且整组不写入。scope_dept_id 引用的部门同样校验。
                 返回归一化（去重升序）后的配置。
            operationId: RoleService_SetRoleDataScope
            parameters:
                - name: id
                  in: path
                  description: 目标角色的服务端标识。
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/perm.v1.SetRoleDataScopeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/perm.v1.RoleDataScope'
    /v1/roles/{id}/menus:
        get:
            tags:
                - RoleService
            description: |-
                ListRoleMenus 返回角色当前的有效授权菜单 ID 集合（升序）：已停用/
                 软删菜单的残留映射不出现在回显集合，与功能权限判定的活跃口径一致，
                 回显集合可原样作为 SetRoleMenus 的输入（整组替换按有效授权对账，
                 失活授权随差量清除）。菜单本身的管理归菜单服务。
            operationId: RoleService_ListRoleMenus
            parameters:
                - name: id
                  in: path
                  description: 目标角色的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/perm.v1.RoleMenuSet'
        put:
            tags:
                - RoleService
            description: |-
                SetRoleMenus 设置角色的菜单授权，整组替换（差量同步：移除不在集合内
                 的映射行——物理删除，补建缺失授权，既有授权行保留授权人/授权时间）。
                 空集合合法（清空全部授权）。菜单必须存在且启用（跨租户等同不存在），
                 任一未知返回 INVALID_ARGUMENT 且整组不写入。返回设置后的授权集合
                 （升序）。语义幂等：重复提交同一集合不改变结果。
            operationId: RoleService_SetRoleMenus
            parameters:
                - name: id
                  in: path
                  description: 目标角色的服务端标识。
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/perm.v1.SetRoleMenusRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/perm.v1.RoleMenuSet'
