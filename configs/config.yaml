server:
  http:
    addr: 0.0.0.0:8000
    # SSE 治理：全局超时归零，避免 Kratos 入站 filter 的 WithTimeout 截断
    # AG-UI 长流（SSE 写循环监听请求 ctx.Done，1s 即断）。普通路由的请求
    # 超时由 server 层的路由级超时中间件按 http.request_timeout 恢复；
    # AG-UI / ack 前缀路径跳过该中间件，运行时长由 agent.agui.timeout 兜底。
    timeout: 0s
    # 非 agent 路由的请求超时（覆盖生成代码端点与未来手写端点）。
    request_timeout: 1s
    # CORS 跨域共享（可选，默认关闭不输出任何 CORS 头）。开启时响应恒带
    # Access-Control-Expose-Headers: x-trace-id, x-request-id；allowed_origins
    # 为精确 origin（scheme://host[:port]）清单，条目 "*" 表示任意来源。
    cors:
      enabled: false
      allowed_origins: []
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
  # trace：可信上游网段。仅这些来源的合法 traceparent 被继承，否则剥头新建根。
  trace:
    trusted_networks:
      - 127.0.0.1/32
      - ::1/128
data:
  database:
    # 槽位按用途分层：master 业务主库、system 系统库。当前各槽指向
    # 同一实例，DSN 收敛到 data.database.<用途>.source。
    master:
      # 运行角色 grape_u（非超级用户，真实承受 RLS；授权见 sqlc/rls.sql）。
      # 指向已按仓库根 deploy_db.md 完成部署的库。
      source: ${DATABASE_SOURCE:postgres://grape_u:grape_u_pwd@127.0.0.1:5432/grape}
      # Log every executed statement. Development only.
      debug: true
    system:
      # 当前与 master 同实例；拆分时只改此处。
      source: ${DATABASE_SOURCE:postgres://grape_u:grape_u_pwd@127.0.0.1:5432/grape}
      debug: true
auth:
  # default_tenant_id：登录未指明租户时的回落租户。指向种子数据里的全租户管理员。
  default_tenant_id: t-super-01
agent:
  # app_name：core runner / AG-UI / ack 三者共用的会话存储键组成部分，
  # 三处必须一致，否则会话定位失败。
  app_name: grape-agent
  llm:
    # provider：OpenAI 兼容变体（openai / deepseek / qwen / minimax / kimi）；
    # base_url 留空时由框架按变体取内置默认端点。
    provider: openai
    base_url: ${AGENT_LLM_BASE_URL:https://api.deepseek.com}
    # api_key 只经环境变量注入，不落默认配置。
    api_key: ${AGENT_LLM_API_KEY:}
    model: ${AGENT_LLM_MODEL:deepseek-flash}
    # 单次模型调用超时；未设置用框架默认。
    timeout: 60s
    # failover：主 provider 故障时按优先级切换备 provider。
    # enabled=false 零包装（现行为）；启用时备选按序尝试，全部失败聚合
    # 报错。备选 api_key 同样只经环境变量注入。
    failover:
      enabled: false
      candidates: []
      # candidates 示例（启用时放开并填值）：
      # - provider: openai
      #   base_url: ${AGENT_LLM_FAILOVER_BASE_URL:}
      #   api_key: ${AGENT_LLM_FAILOVER_API_KEY:}
      #   model: ${AGENT_LLM_FAILOVER_MODEL:gpt-4o-mini}
      #   timeout: 60s
    # hedge：对延迟敏感的重复请求策略。原始请求 delay 后未出
    # 结果即发副本，先出有效内容者获胜、其余取消；重复请求成倍放大上游
    # 调用量，只对延迟抖动显著且调用幂等的场景启用。
    hedge:
      enabled: false
      # 相邻启动间隔；0 取框架默认 100ms。
      delay: 0s
      # 并发副本总数（含原始请求），启用时必须 ≥ 2。
      max_copies: 2
    # logging：LLM 调用回调日志。enabled=false 零包装无任何
    # 新日志；启用后每次模型调用（含 failover 各次候选尝试）落 grape
    # logger（ctx 带 trace_id 自动展开）。提示词/补全默认不记，内容级
    # 脱敏归审计与复现视图面；api_key 在 HTTP 客户端配置面，从不入日志。
    logging:
      enabled: false
      log_prompts: false
      log_completions: false
  agui:
    # base_path：AG-UI 与 ack 的共同路由前缀；chat 在前缀根，
    # /history、/cancel 与 /ack/confirmations 同前缀。
    base_path: /agui
    # 单次运行超时（服务端兜底；超时的未决确认由它结算为拒绝）。
    timeout: 1800s
    # SSE 心跳间隔，保持中间设备不掐空闲流。
    heartbeat_interval: 15s
    # 单身份（租户+用户）同时在途运行数上限。chat 运行请求
    # 超限即 429；/history、/cancel 与 ack 确认路由不受限。0 = 关闭
    # （默认）。计数为进程内内存态，多实例部署时是每实例上限。
    max_concurrent_runs: 0
  # session_storage：会话存储（框架 session/postgres，schema agent +
  # agent_ 表前缀）保留策略。0 值语义见 conf.proto 注释：session/app/user
  # state 的 0 = 永不过期；track 事件的 0 = 沿用 session_ttl。
  # grape 不用 app 级 state 存租户业务数据（设施面例外，见
  # internal/README.md agent 层说明）。
  session_storage:
    session_ttl: 0s
    track_event_ttl: 0s
    app_state_ttl: 0s
    user_state_ttl: 0s
  # compression：请求侧上下文压缩。压缩只作用于请求投影
  # 副本，session 事件流始终保留原文；占位符带 event_id，模型可经
  # session_load 取回片段。0 值语义：tool_result_max_tokens 与
  # keep_recent_requests 取框架默认（1024 / 1），
  # oversized_tool_result_max_tokens 为关闭（框架推荐 8192 仅是参考）。
  compression:
    enabled: false
    tool_result_max_tokens: 0
    keep_recent_requests: 0
    oversized_tool_result_max_tokens: 0
    force_clean_tool_names: []
    keep_tool_names: []
  # summarization：会话摘要配置位，当前恒关闭（启用需 summarizer 模型
  # 与注入模式选型，当前未实现）。
  summarization:
    enabled: false

vector:
  # 向量检索设施（pgvector）。启用前须先按 deploy_db.md 完成
  # agent_vector.sql 部署；enabled=false 时向量仓储按设施缺失拒绝调用，
  # 不触库。
  enabled: false
  # 向量表名（agent schema 内、agent_ 前缀），必须与部署 DDL 一致；
  # 留空取默认 agent_document。
  table_name: agent_document
  # 全局默认嵌入空间键：租户未配置（sys_tenant_config 的 vector.embedder
  # 键）时的兜底，必须引用下方 embedders 已声明的键。
  default_embedder: ${VECTOR_EMBEDDING_MODEL:text-embedding-3-small}
  # embedders：嵌入空间清单（≥1 条）。空间键 = model（version 留空）或
  # model@version，即落库 embedder 列与检索过滤用的身份；dimension 必须
  # 与 agent_vector.sql 内对应维度的表达式部分 HNSW 索引一致（默认部署
  # 1024），装配期探针逐维度校验。多空间并存支撑多模型与版本迭代，换
  # 版本即新空间，存量经重摄取迁移。
  embedders:
    - # provider 变体（预留位）：当前仅支持 OpenAI 兼容端点，留空即可。
      provider: openai
      base_url: ${VECTOR_EMBEDDING_BASE_URL:}
      api_key: ${VECTOR_EMBEDDING_API_KEY:}
      model: ${VECTOR_EMBEDDING_MODEL:text-embedding-3-small}
      # 版本后缀（可空）：迭代标识（如 v1、v2），非空时空间键派生为
      # model@version——放开本项须同步修改上方 default_embedder 为派生
      # 键，否则装配期校验拒绝启动。
      # version: v1
      dimension: 1024
      # 单次 embedding 调用超时；未设置取 30s。
      timeout: 30s
telemetry:
  # OpenTelemetry 链路遥测。enabled=false 完全 noop：不构造
  # exporter、不发起任何连接；开启后 server span 经 OTLP gRPC 导出。
  enabled: false
  # OTLP gRPC exporter 地址。
  endpoint: localhost:4317
  # exporter 是否走明文（无 TLS）。本地 collector 通常为 true。
  insecure: true
  # 根 span 采样比例 0~1；未设置取 1.0（全采）。按 trace-id 确定性判定，
  # x-trace-id 头与日志 trace_id 字段不受采样影响。
  sampler_ratio: 1.0
  # 资源属性 service.name；空取 grape。service_version 空省略。
  service_name: grape

log:
  # 应用日志落盘：标准输出始终保留，落盘是额外 sink。滚动与保留由
  # lumberjack 承担：单文件超过 max_size_mb 滚动新文件，旧文件按
  # max_backups / max_age_days 收敛，compress 开启 gzip 归档。
  # 各 0 值项沿用 lumberjack 默认（100MB / 不按数量清理 / 不按时间
  # 清理 / 不压缩）。路径相对进程工作目录，留空不落盘。
  file: logs/grape.log
  max_size_mb: 50
  max_backups: 7
  max_age_days: 14
  compress: true
