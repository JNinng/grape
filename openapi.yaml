                - UserGroupService
            description: |-
                UpdateUserGroup 覆盖可变字段（name、status、remark）。code 与
                 owner_user_id 是身份/归属列，在输入中被忽略：组编码创建后不变，
                 组长变更走部署面专项口径（本批不提供）。
            operationId: UserGroupService_UpdateUserGroup
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/org.v1.UserGroup'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/org.v1.UserGroup'
    /v1/user-groups/{id}:
        get:
            tags:
                - UserGroupService
            description: GetUserGroup 按 id 查询单个用户组。跨租户不可见等同不存在（NOT_FOUND）。
            operationId: UserGroupService_GetUserGroup
            parameters:
                - name: id
                  in: path
                  description: 目标用户组的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/org.v1.UserGroup'
        delete:
            tags:
                - UserGroupService
            description: |-
                DeleteUserGroup 软删除用户组（deleted_at 置位）。成员映射行随物理
                 保留：映射表无外键级联，残留行被权限推导与成员列表的组表/用户表
                 活跃过滤排除，不产生可见副作用；code 与 name 的唯一约束限定未删除
                 组间，软删后可复用。
            operationId: UserGroupService_DeleteUserGroup
            parameters:
                - name: id
                  in: path
                  description: 目标用户组的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/user-groups/{id}/members:
        get:
            tags:
                - UserGroupService
            description: |-
                ListUserGroupMembers 分页返回组成员（联结用户表展示姓名/昵称/状态，
                 按添加时间升序、user_id 升序稳定排序）。组不存在或跨租户返回
                 NOT_FOUND；已软删用户不出现在成员列表。
            operationId: UserGroupService_ListUserGroupMembers
            parameters:
                - name: id
                  in: path
                  description: 目标用户组的服务端标识。
                  required: true
                  schema:
                    type: string
                - name: page
                  in: query
                  description: 页码，缺省 1；小于 1 归一化为 1。
                  schema:
                    type: integer
                    format: int32
                - name: pageSize
                  in: query
                  description: 每页条数，缺省 20；上限 200，越界归一化为 200。
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/org.v1.UserGroupMemberSet'
    /v1/users/assign-roles:
        post:
            tags:
                - UserService
            description: |-
                AssignRoles 把多个角色分配给目标用户：先库内批量判定
                 （fn_can_assign_role），全部通过才写入映射；任一不通过整批拒绝
                 （FORBIDDEN）。已拥有的角色跳过，返回实际新增条数。
            operationId: UserService_AssignRoles
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.AssignRolesRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.AssignRolesReply'
    /v1/users/create:
        post:
            tags:
                - UserService
            description: |-
                CreateUser 创建用户并设置初始密码（服务端哈希后落库）。
                 租户内 name/email/phone 唯一，冲突返回 ALREADY_EXISTS。
            operationId: UserService_CreateUser
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.CreateUserRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.User'
    /v1/users/list:
        post:
            tags:
                - UserService
            description: |-
                ListUsers 按动态查询协议返回一页用户。过滤表达式非法、字段未知、
                 操作符不允许、条件冲突、跨表游标均返回 INVALID_ARGUMENT。
            operationId: UserService_ListUsers
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/query.v1.Query'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.UserSet'
    /v1/users/password:
        post:
            tags:
                - UserService
            description: |-
                SetUserPassword 设置新密码（服务端哈希后落库）。
                 密码不出现在任何读接口的响应中。
            operationId: UserService_SetUserPassword
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.SetUserPasswordRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/users/transfer-owner:
        post:
            tags:
                - UserService
            description: |-
                TransferUserOwner 修改用户的归属三元组，两头校验：该用户本身
                 有权操作，且新归属的人/部门/组在可见范围内，否则 FORBIDDEN。
                 归属字段传 null 表示清掉该归属。
            operationId: UserService_TransferUserOwner
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.TransferUserOwnerRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.User'
    /v1/users/update:
        put:
            tags:
                - UserService
            description: |-
                UpdateUser 覆盖可变字段（name、nickname、email、phone、remark、
                 locale、status）。password、归属三元组与时间戳不由本接口写入。
            operationId: UserService_UpdateUser
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.User'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.User'
    /v1/users/{id}:
        get:
            tags:
                - UserService
            description: GetUser 按 id 查询单个用户。数据范围不可见等同不存在。
            operationId: UserService_GetUser
            parameters:
                - name: id
                  in: path
                  description: 目标用户的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.User'
        delete:
            tags:
                - UserService
            description: DeleteUser 软删除用户（deleted_at 置位，租户内唯一键随之可复用）。
            operationId: UserService_DeleteUser
            parameters:
                - name: id
                  in: path
                  description: 目标用户的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
components:
    schemas:
        google.protobuf.Value:
            description: Represents a dynamically typed value which can be either null, a number, a string, a boolean, a recursive struct value, or a list of values.
        org.v1.AddUserGroupMembersReply:
            type: object
            properties:
                added:
                    type: string
                    description: 实际新增的映射条数（已是成员的用户跳过）。
            description: AddUserGroupMembersReply 是 UserGroupService.AddUserGroupMembers 的输出。
        org.v1.AddUserGroupMembersRequest:
            required:
                - id
                - userIds
            type: object
            properties:
                id:
                    type: string
                    description: 目标用户组的服务端标识。
                userIds:
                    type: array
                    items:
                        type: string
                    description: 要添加的用户 ID 列表；重复项去重。
            description: AddUserGroupMembersRequest 是 UserGroupService.AddUserGroupMembers 的输入。
        org.v1.CreateDeptRequest:
            required:
                - dept
            type: object
            properties:
                dept:
                    allOf:
                        - $ref: '#/components/schemas/org.v1.Dept'
                    description: 要创建的部门。id、created_by/updated_by 与时间戳在输入中被忽略。
            description: CreateDeptRequest 是 DeptService.CreateDept 的输入。
        org.v1.CreateUserGroupRequest:
            required:
                - group
            type: object
            properties:
                group:
                    allOf:
                        - $ref: '#/components/schemas/org.v1.UserGroup'
                    description: 要创建的用户组。id、created_by/updated_by 与时间戳在输入中被忽略。
            description: CreateUserGroupRequest 是 UserGroupService.CreateUserGroup 的输入。
        org.v1.Dept:
            type: object
            properties:
                id:
                    type: string
                    description: 服务端生成的标识。只读。
                status:
                    type: integer
                    description: 数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                    format: int32
                name:
                    type: string
                    description: 部门名，租户内未删除部门间唯一。
                parentId:
                    type: string
                    description: 父部门 ID；根部门为 null。创建时生效，更新时忽略（移动走 MoveDept）。
                ownerUserId:
                    type: string
                    description: 部门管理员用户 ID，必填。
                ownerUserGroupId:
                    type: string
                    description: 归属用户组 ID，可空。创建时生效，更新时忽略。
                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。服务端生成，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。服务端生成，只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间，通常为空。只读。
                    format: date-time
            description: Dept 是部门的规范表示。审计列与时间戳只读；闭包路径不出现在任何接口。
        org.v1.DeptSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.Dept'
                    description: 本页部门，顺序遵循查询中的 sort。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现。
                hasMore:
                    type: boolean
                    description: 是否还有后续页。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0。
                    format: int32
            description: DeptSet 是 ListDepts 返回的分页集合。
        org.v1.DeptTreeNode:
            type: object
            properties:
                dept:
                    allOf:
                        - $ref: '#/components/schemas/org.v1.Dept'
                    description: 本节点的部门。
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.DeptTreeNode'
                    description: 直接子节点。
            description: |-
                DeptTreeNode 是 GetDeptTree 返回的树节点：部门与其子树。children 按部门
                 创建时间升序排列（同刻按 id 升序），与叶子平铺顺序一致。
        org.v1.DeptTreeReply:
            type: object
            properties:
                roots:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.DeptTreeNode'
                    description: 根节点集合（parent_id 为空的部门）。
                total:
                    type: string
                    description: 树内节点总数（= 租户内未删除部门数），供前端提示。
            description: DeptTreeReply 是 DeptService.GetDeptTree 的输出。
        org.v1.MoveDeptRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: 被移动部门的服务端标识。
                parentId:
                    type: string
                    description: |-
                        新父部门 ID；null（缺省）表示移为根部门。不能是被移动部门自身或
                         其子树内的部门。
            description: MoveDeptRequest 是 DeptService.MoveDept 的输入。
        org.v1.RemoveUserGroupMembersReply:
            type: object
            properties:
                removed:
                    type: string
                    description: 实际移除的映射条数（非成员返回 0，不报错）。
            description: |-
                RemoveUserGroupMembersReply 是 UserGroupService.RemoveUserGroupMembers
                 的输出。
        org.v1.RemoveUserGroupMembersRequest:
            required:
                - id
                - userIds
            type: object
            properties:
                id:
                    type: string
                    description: 目标用户组的服务端标识。
                userIds:
                    type: array
                    items:
                        type: string
                    description: 要移除的用户 ID 列表；重复项去重。
            description: |-
                RemoveUserGroupMembersRequest 是 UserGroupService.RemoveUserGroupMembers
                 的输入。
        org.v1.UserGroup:
            type: object
            properties:
                id:
                    type: string
                    description: 服务端生成的标识。只读。
                status:
                    type: integer
                    description: 数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                    format: int32
                name:
                    type: string
                    description: 组名，租户内未删除用户组间唯一。
                code:
                    type: string
                    description: 组编码，租户内未删除用户组间唯一；创建后不可变。
                remark:
                    type: string
                    description: 备注，可空。
                ownerUserId:
                    type: string
                    description: 组长/归属用户 ID，可空。创建时生效，更新时忽略。
                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。服务端生成，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。服务端生成，只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间，通常为空。只读。
                    format: date-time
            description: UserGroup 是用户组的规范表示。审计列与时间戳只读。
        org.v1.UserGroupMember:
            type: object
            properties:
                userId:
                    type: string
                    description: 成员用户 ID。
                name:
                    type: string
                    description: 用户名（sys_user.name）。
                nickname:
                    type: string
                    description: 用户昵称。
                status:
                    type: integer
                    description: 用户数据状态：0 禁用、1 启用。
                    format: int32
                addedBy:
                    type: string
                    description: 添加人。只读。
                addedAt:
                    type: string
                    description: 添加时间。只读。
                    format: date-time
            description: |-
                UserGroupMember 是组成员条目：映射行与成员用户的展示字段的联结视图。
                 全部字段只读；成员的增删走 Add/RemoveUserGroupMembers。
        org.v1.UserGroupMemberSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.UserGroupMember'
                    description: 本页成员，按添加时间升序（同刻按 user_id 升序）。
                total:
                    type: string
                    description: 匹配的总成员数。
                hasMore:
                    type: boolean
                    description: 是否还有后续页。
            description: UserGroupMemberSet 是 ListUserGroupMembers 返回的分页集合。
        org.v1.UserGroupSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.UserGroup'
                    description: 本页用户组，顺序遵循查询中的 sort。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现。
                hasMore:
                    type: boolean
                    description: 是否还有后续页。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0。
                    format: int32
            description: UserGroupSet 是 ListUserGroups 返回的分页集合。
        perm.v1.CreateMenuSuperRequest:
            required:
                - menu
            type: object
            properties:
                menu:
                    allOf:
                        - $ref: '#/components/schemas/perm.v1.Menu'
                    description: |-
                        要创建的菜单。id、created_by/updated_by 与时间戳在输入中被忽略；
                         parent_id 引用的父菜单必须存在且未删除。
            description: CreateMenuSuperRequest 是 MenuService.CreateMenuSuper 的输入。
        perm.v1.CreateRoleRequest:
            required:
                - role
            type: object
            properties:
                role:
                    allOf:
                        - $ref: '#/components/schemas/perm.v1.Role'
                    description: |-
                        要创建的角色。id、role_type、data_scope、scope_dept_id、created_by/
                         updated_by 与时间戳在输入中被忽略。
            description: CreateRoleRequest 是 RoleService.CreateRole 的输入。
        perm.v1.GetMyPermissionsReply:
            type: object
            properties:
                codes:
                    type: array
                    items:
                        type: string
                    description: 当前用户持有的功能权限码集合（去重升序）。
            description: GetMyPermissionsReply 是 PermissionService.GetMyPermissions 的输出。
        perm.v1.Menu:
            type: object
            properties:
                id:
                    type: string
                    description: 服务端生成的标识。只读。
                status:
                    type: integer
                    description: |-
                        数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                         停用的菜单不再产生功能权限。
                    format: int32
                name:
                    type: string
                    description: 菜单/权限名称。
                permissionCode:
                    type: string
                    description: |-
                        权限编码，租户内未删除菜单间唯一（如 sys:user:create）；创建后
                         不可变，更新输入中被忽略。
                parentId:
                    type: string
                    description: |-
                        父级菜单 ID，未设置表示根菜单/顶级权限分组；更新输入中被忽略
                        （结构变更走 MoveMenuSuper）。
                menuType:
                    type: integer
                    description: |-
                        菜单类型：1 目录、2 菜单、3 按钮（操作权限点）。创建后不可变，
                         更新输入中被忽略。
                    format: int32
                icon:
                    type: string
                    description: 菜单图标，可空。
                routePath:
                    type: string
                    description: 前端路由路径，可空。
                component:
                    type: string
                    description: 前端组件路径，可空。
                permissionExpr:
                    type: string
                    description: 权限表达式（应用层匹配用），可空。
                sortOrder:
                    type: integer
                    description: 排序号，树内同级按其升序排列。
                    format: int32
                remark:
                    type: string
                    description: 备注，可空。
                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。服务端生成，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。服务端生成，只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间，通常为空。只读。
                    format: date-time
            description: Menu 是菜单/权限点的规范表示。审计列与时间戳只读。
        perm.v1.MenuTreeNode:
            type: object
            properties:
                menu:
                    allOf:
                        - $ref: '#/components/schemas/perm.v1.Menu'
                    description: 本节点菜单。
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/perm.v1.MenuTreeNode'
                    description: 直接子节点，顺序与平铺列表一致。
            description: MenuTreeNode 是菜单树节点：菜单与其直接子节点。
        perm.v1.MenuTreeReply:
            type: object
            properties:
                roots:
                    type: array
                    items:
                        $ref: '#/components/schemas/perm.v1.MenuTreeNode'
                    description: 根节点集合（parent_id 为空的菜单，父引用缺失的行按根兜底挂载）。
                total:
                    type: string
                    description: 树内节点总数（未删除菜单总数）。
            description: MenuTreeReply 是 GetMenuTree 返回的树形集合。
        perm.v1.MoveMenuSuperRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: 目标菜单的服务端标识。
                parentId:
                    type: string
                    description: |-
                        新父级菜单 ID；未设置表示移为根。引用的父菜单必须存在且未删除，
                         且不得位于被移动菜单的子树内（防环）。
            description: MoveMenuSuperRequest 是 MenuService.MoveMenuSuper 的输入。
        perm.v1.Role:
            type: object
            properties:
                id:
                    type: string
                    description: 服务端生成的标识。只读。
                status:
                    type: integer
                    description: |-
                        数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                         停用的角色失去分配资格与数据范围推导效力。
                    format: int32
                name:
                    type: string
                    description: 角色名，租户内未删除角色间唯一。
                code:
                    type: string
                    description: 角色编码，租户内未删除角色间唯一；创建后不可变。
                roleType:
                    type: integer
                    description: |-
                        角色类型：1 系统预置（不可删除）、2 租户自定义。服务端定值，
                         创建与更新输入中均被忽略。
                    format: int32
                dataScope:
                    type: integer
                    description: |-
                        数据范围规则：1-仅本人 2-本部门 3-本部门及子部门 4-指定人 5-指定部门
                         6-用户组 7-全租户。由 SetRoleDataScope 维护，创建与更新输入中被忽略。
                    format: int32
                scopeDeptId:
                    type: string
                    description: |-
                        组织可见范围：限定角色可分配的部门层级（NULL=全租户可分配，具体部门
                         ID=仅该部门及子部门可分配）。由 SetRoleDataScope 维护，输入中被忽略。
                remark:
                    type: string
                    description: 备注，可空。
                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。服务端生成，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。服务端生成，只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间，通常为空。只读。
                    format: date-time
            description: Role 是角色的规范表示。审计列与时间戳只读。
        perm.v1.RoleDataScope:
            type: object
            properties:
                roleId:
                    type: string
                    description: 所属角色 ID。
                dataScope:
                    type: integer
                    description: 数据范围规则：1-7，取值见 Role.data_scope。
                    format: int32
                scopeDeptId:
                    type: string
                    description: 组织可见范围（分配层级限定），可空。
                idScopes:
                    type: array
                    items:
                        $ref: '#/components/schemas/perm.v1.RoleIDScopeEntry'
                    description: ID 范围明细集合。
                allowedDeptIds:
                    type: array
                    items:
                        type: string
                    description: 分发部门 ID 集合（升序）。
            description: |-
                RoleDataScope 是角色的数据范围配置视图。data_scope 决定 id_scopes 的
                 消费方式（4 指定人/5 指定部门/6 用户组分别只读对应 type 的明细）；
                 allowed_dept_ids 只参与角色分配判定（fn_can_assign_role），不影响
                 持有者的数据可见范围——用户最终数据边界由 data_scope 及其明细决定。
        perm.v1.RoleIDScopeEntry:
            type: object
            properties:
                type:
                    type: integer
                    description: |-
                        明细类型：1 用户 ID、2 部门 ID、3 用户组 ID。仅在角色 data_scope
                         为 4/5/6 时分别被数据范围推导消费，其余取值下为惰性配置。
                    format: int32
                dataId:
                    type: string
                    description: 指向的数据 ID。
            description: RoleIDScopeEntry 是数据范围明细条目：type 决定 data_id 的指向。
        perm.v1.RoleMenuSet:
            type: object
            properties:
                menuIds:
                    type: array
                    items:
                        type: string
                    description: 已授权菜单 ID，升序。
            description: |-
                RoleMenuSet 是角色当前的有效授权菜单 ID 集合（升序）：已停用/软删菜单
                 的残留映射不出现在本集合。
        perm.v1.RoleSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/perm.v1.Role'
                    description: 本页角色，顺序遵循查询中的 sort。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现。
                hasMore:
                    type: boolean
                    description: 是否还有后续页。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0。
                    format: int32
            description: RoleSet 是 ListRoles 返回的分页集合。
        perm.v1.SetRoleDataScopeRequest:
            required:
                - id
                - dataScope
            type: object
            properties:
                id:
                    type: string
                    description: 目标角色的服务端标识。
                dataScope:
                    type: integer
                    description: 数据范围规则：1-7。
                    format: int32
                scopeDeptId:
                    type: string
                    description: 组织可见范围（分配层级限定），可空；非空时引用的部门必须存在且启用。
                idScopes:
                    type: array
                    items:
                        $ref: '#/components/schemas/perm.v1.RoleIDScopeEntry'
                    description: ID 范围明细集合；引用的用户/部门/用户组必须存在且启用，重复条目去重。
                allowedDeptIds:
                    type: array
                    items:
                        type: string
                    description: 分发部门 ID 集合；引用的部门必须存在且启用，重复项去重。
            description: SetRoleDataScopeRequest 是 RoleService.SetRoleDataScope 的输入。
        perm.v1.SetRoleMenusRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: 目标角色的服务端标识。
                menuIds:
                    type: array
                    items:
                        type: string
                    description: |-
                        目标授权菜单 ID 集合；空集合清空全部授权；重复项去重，引用的菜单
                         必须存在且启用。
            description: SetRoleMenusRequest 是 RoleService.SetRoleMenus 的输入。
        query.v1.Condition:
            type: object
            properties:
                field:
                    type: string
                    description: 字段键，小驼峰，如 createdAt。
                op:
                    type: string
                    description: |-
                        操作符：eq、neq、in、not_in、gt、gte、lt、lte、between、contains、
                         prefix、suffix、has、is_null、not_null。每列可用的操作符集合由 schema
                         声明并在服务端校验。
                value:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Value'
                    description: 左操作数（between 时为下界）。
                rightValue:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Value'
                    description: between 的上界。
            description: |-
                Condition 是单个过滤条件。

                 value 与 right_value 为 JSON 值，接受形态由字段数据类型与操作符决定：
                 整型字段的 eq 接受数字；between 在 value 放下界、right_value 放上界；
                 in / not_in 接受数组；is_null / not_null 不需要值。
        query.v1.Pagination:
            type: object
            properties:
                page:
                    type: integer
                    description: 页码，从 1 开始。offset 模式。
                    format: int32
                pageSize:
                    type: integer
                    description: 每页条数。未设置时回落到表级默认值；上限受表级最大值约束。
                    format: int32
                after:
                    type: string
                    description: 上一页响应的 next_cursor。游标模式；与 page 互斥。
                includeTotal:
                    type: boolean
                    description: 是否计算 total。缺省为 true。
            description: |-
                Pagination 是分页输入。page 从 1 开始，为 offset 模式；after 非空即切换到
                 游标模式，且必须携带同表上一页返回的 next_cursor。游标按表做指纹校验，
                 跨资源的游标会被拒绝。
        query.v1.Query:
            type: object
            properties:
                fields:
                    type: array
                    items:
                        type: string
                    description: |-
                        投影字段列表（小驼峰）。显式空数组、@internal 字段、被禁用字段与未知字段
                         均被拒绝；pk 与表级默认排序键会强制并入查询结果。
                where:
                    type: array
                    items:
                        $ref: '#/components/schemas/query.v1.Condition'
                    description: 过滤条件，多条之间恒为 AND。
                sort:
                    type: array
                    items:
                        $ref: '#/components/schemas/query.v1.SortItem'
                    description: 排序项，按顺序生效；为空时回落到表级默认排序。
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/query.v1.Pagination'
                    description: 分页输入。
            description: |-
                Query 是动态 List 查询协议，镜像存储层的 dynq.Query。
                 where 中多条条件恒为 AND 组合，不支持 OR 与条件分组。
        query.v1.SortItem:
            type: object
            properties:
                field:
                    type: string
                    description: 字段键，小驼峰。仅 @sortable 列被接受。
                order:
                    type: string
                    description: 排序方向：asc（默认）或 desc。
            description: SortItem 是单个排序项。
        session.v1.LoginReply:
            type: object
            properties:
                tokenType:
                    type: string
                    description: '令牌类型，固定 "Bearer"，经 Authorization: Bearer 头携带。'
                accessToken:
                    type: string
                    description: 明文访问令牌，仅本次响应返回。
                refreshToken:
                    type: string
                    description: 明文刷新令牌，仅本次响应返回；下一次轮换后失效。
                expiresAt:
                    type: string
                    description: 访问令牌过期时间（存储介质时钟）。
                    format: date-time
                user:
                    allOf:
                        - $ref: '#/components/schemas/session.v1.SessionUser'
                    description: 会话所属用户摘要。
            description: LoginReply 是登录/刷新的输出。
        session.v1.LoginRequest:
            required:
                - userName
                - password
            type: object
            properties:
                tenantId:
                    type: string
                    description: 租户 ID。为空时回落服务端默认租户（默认租户由装配层配置注入）。
                userName:
                    type: string
                    description: 用户名，租户内唯一。
                password:
                    type: string
                    description: 明文口令，仅用于本次校验，不落日志。
                deviceInfo:
                    type: string
                    description: 登录设备信息（OS/浏览器/型号等），由客户端声明。
                ipAddress:
                    type: string
                    description: 登录来源 IP，由客户端声明。
            description: LoginRequest 是 SessionService.Login 的输入。
        session.v1.LogoutReply:
            type: object
            properties: {}
            description: |-
                LogoutReply 是 SessionService.Logout 的输出：无字段。幂等语义下
                 令牌已撤销或无对应会话时同样返回空响应。
        session.v1.LogoutRequest:
            type: object
            properties: {}
            description: |-
                LogoutRequest 是 SessionService.Logout 的输入：无请求体字段，访问
                 令牌经 Authorization: Bearer 头携带，不经请求体。
        session.v1.RefreshRequest:
            required:
                - refreshToken
            type: object
            properties:
                refreshToken:
                    type: string
                    description: 明文刷新令牌，仅用于本次轮换。
            description: RefreshRequest 是 SessionService.Refresh 的输入。
        session.v1.SessionUser:
            type: object
            properties:
                id:
                    type: string
                    description: 用户 ID。
                tenantId:
                    type: string
                    description: 会话归属租户。
                name:
                    type: string
                    description: 用户名。
                nickname:
                    type: string
                    description: 昵称。
            description: SessionUser 是登录响应中的用户摘要。
        user.v1.AssignRolesReply:
            type: object
            properties:
                added:
                    type: string
                    description: 实际新增的映射条数（目标用户已拥有的角色跳过）。
            description: AssignRolesReply 是 UserService.AssignRoles 的输出。
        user.v1.AssignRolesRequest:
            required:
                - userId
                - roleIds
            type: object
            properties:
                userId:
                    type: string
                    description: 被分配的目标用户。
                roleIds:
                    type: array
                    items:
                        type: string
                    description: 要分配的角色列表；重复项去重。
            description: AssignRolesRequest 是 UserService.AssignRoles 的输入。
        user.v1.CreateUserRequest:
            required:
                - user
                - password
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/user.v1.User'
                    description: 要创建的用户。id、created_by/updated_by 与时间戳在输入中被忽略。
                password:
                    type: string
                    description: 初始密码。仅存储，不出现在任何读接口的响应中。
            description: CreateUserRequest 是 UserService.CreateUser 的输入。
        user.v1.SetUserPasswordRequest:
            required:
                - id
                - password
            type: object
            properties:
                id:
                    type: string
                    description: 目标用户的服务端标识。
                password:
                    type: string
                    description: 新密码。
            description: SetUserPasswordRequest 是 UserService.SetUserPassword 的输入。
        user.v1.TransferUserOwnerRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: 目标用户的服务端标识。
                ownerUserId:
                    type: string
                    description: 新归属用户；null 表示清掉该归属。
                ownerDeptId:
                    type: string
                    description: 新归属部门；null 表示清掉该归属。
                ownerUserGroupId:
                    type: string
                    description: 新归属用户组；null 表示清掉该归属。
            description: TransferUserOwnerRequest 是 UserService.TransferUserOwner 的输入。
        user.v1.User:
            type: object
            properties:
                id:
                    type: string
                    description: 服务端生成的标识。只读。
                status:
                    type: integer
                    description: 数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                    format: int32
                name:
                    type: string
                    description: 用户名，租户内唯一。
                nickname:
                    type: string
                    description: 昵称。
                email:
                    type: string
                    description: 邮箱，租户内唯一，可空。
                phone:
                    type: string
                    description: 手机号，租户内唯一，可空。
                remark:
                    type: string
                    description: 备注，可空。
                locale:
                    type: string
                    description: 语言偏好（BCP-47），如 zh-CN。缺省 zh-CN。
                ownerUserId:
                    type: string
                    description: 归属用户。读接口可见，仅 TransferUserOwner 可写。
                ownerDeptId:
                    type: string
                    description: 归属部门。读接口可见，仅 TransferUserOwner 可写。
                ownerUserGroupId:
                    type: string
                    description: 归属用户组。读接口可见，仅 TransferUserOwner 可写。
                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。服务端生成，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。服务端生成，只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间，通常为空。只读。
                    format: date-time
            description: |-
                User 是用户的规范表示。password 列为 @internal，不跨越 API 边界；
                 审计列与时间戳只读。
        user.v1.UserSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/user.v1.User'
                    description: 本页用户，顺序遵循查询中的 sort。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现。
                hasMore:
                    type: boolean
                    description: 是否还有后续页。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0。
                    format: int32
            description: UserSet 是 ListUsers 返回的分页集合。
tags:
    - name: DeptService
      description: |-
        DeptService 提供部门管理。组织树是租户内资源：租户边界由数据库 RLS
         强制，租户内全部部门对持有令牌的成员可见（表无 @scope，行级无范围）。
         List 走动态查询协议，过滤/排序/投影/分页能力由存储层 schema 注释 DSL
         声明。闭包表 sys_dept_closure 是派生数据，由数据库触发器随部门增删改
         自动维护（校验父级/防环/软删等价删除），不跨越 API 边界。
    - name: MenuService
      description: |-
        MenuService 提供菜单/权限点树的管理。sys_menu 承载功能权限码链的
         宿主树（角色 → 菜单 → 权限码，与数据范围正交），是功能入口表：
         运行角色对它只读（数据库直写已 REVOKE），写面经部署面 SECURITY
         DEFINER 固定口径写函数（租户边界复位、父级校验、防环、软删口径
         收在函数内）。

         读写形态：读端点（GetMenuTree / GetMenu）按权限默认处理——租户边界
         由 RLS 承担（表无 @scope，租户内全可见），方法名不带 super；写端点
         是有意绕过默认权限处理的受控写路径（SECURITY DEFINER 函数），按
         permission.md 口径在方法名带 super。

         软删除口径：菜单删除为软删除（deleted_at 置位），存在未删除直接
         子菜单时拒绝（自叶向根逐层删）；permission_code 在租户内未删除
         菜单间唯一，软删后可复用；已软删/停用菜单不再产生功能权限
         （fn_has_permission 活跃联结过滤），角色-菜单映射行物理残留、
         由 RoleService.SetMenus 的存在性判定排除。
    - name: PermissionService
      description: |-
        PermissionService 提供当前认证用户的功能权限码查询（前端导航过滤的
         数据源）。功能权限码与数据范围正交：只看角色 → 菜单 → 权限码这条链
         （fn_has_permission 同源推导），集合为空表示当前用户不持有任何权限码。
         本端点只受认证约束，不设权限码——权限码集合本身是用户界面的引导数据，
         入口层判定不应对它设门槛。
    - name: RoleService
      description: |-
        RoleService 提供角色管理。角色是租户内资源：租户边界由数据库 RLS 强制，
         租户内全部角色对持有令牌的成员可见（表无 @scope，行级无范围）。List 走
         动态查询协议，过滤/排序/投影/分页能力由存储层 schema 注释 DSL 声明。

         数据范围是一组随角色读写的配置：sys_role.data_scope（1-7）与明细表
         sys_role_id_scope（type 1 用户/2 部门/3 用户组，分别只在 data_scope
         4/5/6 下被消费）与 sys_role_allowed_dept（分发部门，只参与角色分配判定，
         不影响持有者的数据可见范围）由 GetRoleDataScope / SetRoleDataScope 读写，
         设置为整组替换语义。角色-菜单授权（sys_role_menu）承载功能权限码链
         （角色 → 菜单 → 权限码，与数据范围正交），由 ListRoleMenus /
         SetRoleMenus 维护，解除授权走物理删除，整组设置为差量同步（保留行的
         授权人/授权时间不变）。

         软删除口径：角色删除为软删除（deleted_at 置位），code 与 name 的唯一
         约束限定未删除行间，软删后可复用；停用或软删的角色立即失去分配资格与
         数据范围推导效力（判定函数按 status=1 且未删除过滤），已分配的用户
         映射残留但不生效。系统预置角色（role_type=1）不可删除。
    - name: SessionService
      description: |-
        SessionService 提供登录与会话令牌生命周期。令牌是随机不透明值，
         不含租户/用户信息，身份事实以服务端会话记录为准；访问令牌走
         `Authorization: Bearer` 头传输，不走 cookie。
    - name: UserGroupService
      description: |-
        UserGroupService 提供用户组管理。用户组是租户内资源：租户边界由数据库
         RLS 强制，租户内全部用户组对持有令牌的成员可见（表无 @scope，行级无
         范围）。List 走动态查询协议，过滤/排序/投影/分页能力由存储层 schema
         注释 DSL 声明。成员映射 sys_user_group_mapping 不单独立资源：随宿主
         用户组的管理面维护（成员列表/添加/移除），映射行无可变业务字段，移除
         成员走物理删除。组删除为软删除，映射行残留但权限推导侧全部联结组表
         deleted_at IS NULL 过滤，残留行不起作用。
    - name: UserService
      description: |-
        UserService 提供用户管理。List 走动态查询协议，过滤/排序/投影/分页
         能力由存储层 schema 注释 DSL 声明。读写都在服务端注入的租户与数据
         范围内执行（@scope 守卫）：范围不可见的数据等同不存在（NOT_FOUND），
         写侧判定不通过返回 FORBIDDEN。
