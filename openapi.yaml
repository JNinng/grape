                        $ref: '#/components/schemas/knowledge.v1.Document'
                total:
                    type: string
                hasMore:
                    type: boolean
                nextCursor:
                    type: string
                page:
                    type: integer
                    format: int32
            description: DocumentSet 是条目列表的分页集合。
        knowledge.v1.Library:
            type: object
            properties:
                id:
                    type: string
                status:
                    type: integer
                    description: 数据状态：0 禁用、1 启用。创建可省略（缺省启用）；更新必填。
                    format: int32
                name:
                    type: string
                    description: 知识库名（租户内未删除行间唯一）。
                remark:
                    type: string
                    description: 备注。
                embeddingModelKey:
                    type: string
                    description: 嵌入模型键；为空跟随租户/全局默认。
                chunkSize:
                    type: integer
                    description: 切分单块 rune 上限，缺省 800。
                    format: int32
                chunkOverlap:
                    type: integer
                    description: 相邻块重叠 rune 数，缺省 100。
                    format: int32
                validFrom:
                    type: string
                    description: 生效时间，空表示立即生效。
                    format: date-time
                validTo:
                    type: string
                    description: 失效时间，空表示长期有效。
                    format: date-time
                createdBy:
                    type: string
                updatedBy:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                deletedAt:
                    type: string
                    format: date-time
                chunkDelimiter:
                    type: string
                    description: |-
                        切分区分串：非空时先按该字符串切出段落块，超过 chunk_size 的段落块
                         再按固定窗口切分；空串表示不按区分串切分（纯固定窗口）。创建时省略
                         取缺省区分串 "\n\n"（段落空行），更新时省略保持原值；至多 32 字符。
            description: Library 是知识库的规范表示。审计列与时间戳只读。
        knowledge.v1.LibrarySet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/knowledge.v1.Library'
                total:
                    type: string
                hasMore:
                    type: boolean
                nextCursor:
                    type: string
                page:
                    type: integer
                    format: int32
            description: LibrarySet 是 ListLibraries 的分页集合。
        knowledge.v1.ModelOption:
            type: object
            properties:
                modelKey:
                    type: string
                name:
                    type: string
                kind:
                    type: string
                dimension:
                    type: integer
                    format: int32
                platform:
                    type: boolean
            description: ModelOption 是模型下拉选项（只含展示与维度事实，不含密钥）。
        knowledge.v1.ModelOptionSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/knowledge.v1.ModelOption'
            description: ModelOptionSet 是模型选项集合。
        knowledge.v1.ReindexDocumentRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
            description: ReindexDocumentRequest 是 DocumentService.ReindexDocument 的输入。
        knowledge.v1.SearchDocumentsReply:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/knowledge.v1.SearchHit'
                total:
                    type: integer
                    description: 命中条数。
                    format: int32
            description: SearchDocumentsReply 是 DocumentService.SearchDocuments 的输出。
        knowledge.v1.SearchDocumentsRequest:
            required:
                - query
            type: object
            properties:
                query:
                    type: string
                    description: 查询文本，去除首尾空白后 1–512 字符。
                libraryId:
                    type: string
                    description: |-
                        知识库 ID：大于 0 时收窄到该库（必须命中调用方可见库集合，不可见与
                         不存在统一按 LIBRARY_NOT_FOUND 拒绝）；0 或省略检索全部可见知识库；
                         负值拒绝。
                topK:
                    type: integer
                    description: 返回条数：省略或 0 取缺省 5，负值拒绝，超过 20 按 20 返回。
                    format: int32
            description: SearchDocumentsRequest 是 DocumentService.SearchDocuments 的输入。
        knowledge.v1.SearchHit:
            type: object
            properties:
                documentId:
                    type: string
                    description: 切片 ID（"<source_id>#<chunk_index>"），与检索留痕的命中对账。
                sourceId:
                    type: string
                    description: 来源条目 ID（十进制字符串），可经 GetDocument 反查条目原文。
                sourceName:
                    type: string
                    description: 来源名。
                anchor:
                    type: string
                    description: 原文锚点（rune 区间描述）。
                score:
                    type: number
                    description: 归一化相似度，[0,1]，越大越相似。
                    format: double
                content:
                    type: string
                    description: 切片正文原文。
            description: SearchHit 是单条检索命中。
        model.v1.CreateModelRequest:
            required:
                - model
            type: object
            properties:
                model:
                    allOf:
                        - $ref: '#/components/schemas/model.v1.Model'
                    description: 要创建的租户模型行。id/平台标记/审计列在输入中被忽略。
                apiKey:
                    type: string
                    description: API key 明文（只写不读）；为空表示不配置。
            description: CreateModelRequest 是 ModelService.CreateModel 的输入。
        model.v1.CreateModelSuperRequest:
            required:
                - model
            type: object
            properties:
                model:
                    $ref: '#/components/schemas/model.v1.Model'
                apiKey:
                    type: string
            description: CreateModelSuperRequest 是 ModelService.CreateModelSuper 的输入。
        model.v1.Model:
            type: object
            properties:
                id:
                    type: string
                    description: 服务端生成的标识。只读。
                platform:
                    type: boolean
                    description: 是否为平台行（tenant_id=''）。只读。
                status:
                    type: integer
                    description: 数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                    format: int32
                kind:
                    type: string
                    description: 模型类别：text / embedding。创建后不可变。
                name:
                    type: string
                    description: 模型展示名。
                modelKey:
                    type: string
                    description: 选择键与向量空间键，租户/平台内未删除行间唯一；创建后不可变。
                provider:
                    type: string
                    description: provider 变体（openai/deepseek/qwen/glm/minimax/kimi/hunyuan 等）。
                baseUrl:
                    type: string
                    description: OpenAI 兼容端点根地址。
                model:
                    type: string
                    description: 发给 provider 的模型名。
                dimension:
                    type: integer
                    description: 嵌入维度；kind=embedding 时本期必须为 1024。
                    format: int32
                timeoutMs:
                    type: integer
                    description: 单次调用超时（毫秒）。
                    format: int32
                hasApiKey:
                    type: boolean
                    description: 是否已配置密钥（密文或环境变量名）。只读。
                apiKeyEnv:
                    type: string
                    description: 密钥环境变量名。
                remark:
                    type: string
                    description: 备注。
                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间。只读。
                    format: date-time
            description: Model 是模型目录行的规范表示。审计列与时间戳只读；密钥不返回。
        model.v1.ModelSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/model.v1.Model'
            description: ModelSet 是 ListModels 的固定集合（不分页）。
        model.v1.UpdateModelRequest:
            required:
                - model
            type: object
            properties:
                model:
                    allOf:
                        - $ref: '#/components/schemas/model.v1.Model'
                    description: 携带新字段值的租户模型行。id 必填；kind/model_key 在输入中被忽略。
                apiKey:
                    type: string
                    description: 新 API key 明文；省略表示保持原密文不变。
                clearApiKey:
                    type: boolean
                    description: 清除已存的密钥密文。
            description: UpdateModelRequest 是 ModelService.UpdateModel 的输入。
        model.v1.UpdateModelSuperRequest:
            required:
                - model
            type: object
            properties:
                model:
                    $ref: '#/components/schemas/model.v1.Model'
                apiKey:
                    type: string
                clearApiKey:
                    type: boolean
            description: UpdateModelSuperRequest 是 ModelService.UpdateModelSuper 的输入。
        org.v1.AddUserGroupMembersReply:
            type: object
