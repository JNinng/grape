syntax = "proto3";

package order.v1;

option go_package = "grape/api/order/v1;v1";
option java_multiple_files = true;
option java_package = "io.grpc.examples.order.v1";
option objc_class_prefix = "APIOrderV1";

// ErrorReason 是订单资源的错误原因枚举，用于 Kratos 错误的 reason 字段。
enum ErrorReason {
  // 缺省值，不使用。
  ORDER_UNSPECIFIED = 0;
  // 目标订单不存在。
  ORDER_NOT_FOUND = 1;
  // 请求参数非法。
  ORDER_INVALID_ARGUMENT = 2;
}
