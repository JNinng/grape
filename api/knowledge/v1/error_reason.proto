syntax = "proto3";

package knowledge.v1;

option go_package = "grape/api/knowledge/v1;v1";
option java_multiple_files = true;
option java_package = "io.grpc.examples.knowledge.v1";
option objc_class_prefix = "APIKnowledgeV1";

// ErrorReason 是知识库域的错误原因枚举。
enum ErrorReason {
  // 缺省值，不使用。
  KNOWLEDGE_UNSPECIFIED = 0;
  // 目标知识库不存在或不在调用方数据范围内（二者不区分，不泄露存在性）。
  LIBRARY_NOT_FOUND = 1;
  // 知识库请求参数非法（名称/切分参数/有效期等）。
  LIBRARY_INVALID_ARGUMENT = 2;
  // 唯一约束冲突（租户内未删除库间名称被占用）。
  LIBRARY_ALREADY_EXISTS = 3;
  // 知识库仍有未删除条目，禁止删除。
  LIBRARY_HAS_DOCUMENTS = 4;
  // 目标条目不存在（含跨租户不可见）。
  DOCUMENT_NOT_FOUND = 5;
  // 条目请求参数非法（标题/正文/有效期等）。
  DOCUMENT_INVALID_ARGUMENT = 6;
  // 条目 kind 不被创建接口支持（当前接受 text / markdown，file 留给文件
  // 解析摄取放开）。
  DOCUMENT_KIND_UNSUPPORTED = 7;
  // 摄取/重建索引失败（嵌入端点或向量存储错误）。
  DOCUMENT_INDEX_FAILED = 8;
  // 模型选项查询参数非法（kind 未知）。
  MODEL_OPTION_INVALID_ARGUMENT = 9;
  // 知识检索参数非法（查询文本为空或超长、top_k 或 library_id 为负）。
  SEARCH_INVALID_ARGUMENT = 10;
  // 知识检索能力缺失（嵌入或向量设施未启用）。
  SEARCH_UNAVAILABLE = 11;
  // 知识检索执行失败（嵌入端点或向量存储错误，细节只进服务端日志）。
  SEARCH_FAILED = 12;
  // 条目分片查询能力缺失（向量设施未启用）。
  DOCUMENT_CHUNKS_UNAVAILABLE = 13;
  // 条目分片查询执行失败（细节只进服务端日志）。
  DOCUMENT_CHUNKS_FAILED = 14;
  // 文件类型不被文件摄取支持（不在扩展名 / MIME 白名单，或外部档类型而
  // 外部解析服务未配置）。
  FILE_TYPE_UNSUPPORTED = 15;
}
