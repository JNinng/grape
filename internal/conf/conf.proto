syntax = "proto3";
package kratos.api;

option go_package = "grape/internal/conf;conf";

import "google/protobuf/duration.proto";

// Bootstrap 是服务启动配置的根结构，对应 configs/config.yaml。
message Bootstrap {
  // HTTP / gRPC 服务器配置。
  Server server = 1;
  // 存储配置。
  Data data = 2;
  // 登录配置（请求未指明租户时的回落租户）。
  Auth auth = 3;
}

// Auth 是登录的过渡期配置：请求未指明租户时的回落租户（多租户登录
// 形态确定后由服务端解析替代）。
message Auth {
  // 登录未指明租户时的回落租户。
  string default_tenant_id = 1;
}

// Server 是传输层服务器配置。
message Server {
  // HTTP 服务器配置。
  message HTTP {
    // 监听网络类型，如 tcp。
    string network = 1;
    // 监听地址，如 0.0.0.0:8000。
    string addr = 2;
    // 请求超时时间。
    google.protobuf.Duration timeout = 3;
  }
  // gRPC 服务器配置。
  message GRPC {
    // 监听网络类型，如 tcp。
    string network = 1;
    // 监听地址，如 0.0.0.0:9000。
    string addr = 2;
    // 请求超时时间。
    google.protobuf.Duration timeout = 3;
  }
  // Trace 是链路标识配置。
  message Trace {
    // 可信上游网段（CIDR，如 127.0.0.1/32）。仅这些来源发来的合法
    // traceparent 才被继承；为空表示不信任任何上游，一律新建根。
    repeated string trusted_networks = 1;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  // 链路标识配置。
  Trace trace = 3;
}

// Data 是存储层配置。
message Data {
  // PostgreSQL 数据库连接配置。
  message Database {
    // 连接 DSN，如 postgres://user:pass@127.0.0.1:5432/db。
    string source = 1;
    // 记录每条执行的语句与参数。仅开发环境开启。
    bool debug = 2;
  }
  Database database = 1;
}
