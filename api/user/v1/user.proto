syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "query/v1/query.proto";

option go_package = "grape/api/user/v1;v1";
option java_multiple_files = true;
option java_package = "io.grpc.examples.user.v1";
option java_outer_classname = "UserProto";

// UserService 提供用户 CRUD。List 走动态查询协议，
// 过滤 / 排序 / 投影 / 分页能力由存储层 schema 注释 DSL 声明。
service UserService {
  // CreateUser 创建用户并设置初始密码，返回服务端生成 id 后的持久化记录。
  // 邮箱必须唯一，冲突返回 ALREADY_EXISTS。
  rpc CreateUser (CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users/create"
      body: "user"
    };
  }

  // GetUser 按 id 查询单个用户。
  rpc GetUser (GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/users/{id}"
    };
  }

  // GetUserByEmail 按邮箱查询单个用户，邮箱经 email 查询参数传入。
  rpc GetUserByEmail (GetUserByEmailRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/users:by-email"
    };
  }

  // ListUsers 按动态查询协议返回一页用户。
  // 过滤表达式非法、字段未知、操作符不允许、条件冲突、跨表游标
  // 均返回 INVALID_ARGUMENT。
  rpc ListUsers (ListUsersRequest) returns (UserSet) {
    option (google.api.http) = {
      post: "/v1/users/list"
      body: "query"
    };
  }

  // UpdateUser 覆盖已存在用户的可变字段。status、password 与时间戳
  // 由服务端管理，输入中被忽略。
  rpc UpdateUser (UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      put: "/v1/users/update"
      body: "user"
    };
  }

  // SetUserPassword 设置已存在用户的新密码。密码不出现在任何读接口的响应中。
  rpc SetUserPassword (SetUserPasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/users/password"
      body: "*"
    };
  }

  // DeleteUser 物理删除用户。
  rpc DeleteUser (DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/users/{id}"
    };
  }
}

// UserStatus 是用户账号的生命周期状态。
enum UserStatus {
  // 缺省值，服务端不返回。
  USER_STATUS_UNSPECIFIED = 0;
  // 正常账号。
  USER_STATUS_ACTIVE = 1;
  // 已停用但保留的账号。
  USER_STATUS_INACTIVE = 2;
  // 已封禁的账号。
  USER_STATUS_BANNED = 3;
}

// User 是用户的规范表示。password 列为 @hidden，不跨越 API 边界。
message User {
  // 服务端生成的标识。只读。
  int64 id = 1;
  // 用户姓名。
  string name = 2;
  // 唯一邮箱地址。
  string email = 3;
  // 生命周期状态。创建时默认 ACTIVE；更新时不可写。
  UserStatus status = 4;
  // 角色，可空。
  optional string role = 5;
  // 年龄，可空。
  optional int32 age = 6;
  // 评分（0-100），可空。
  optional double score = 7;
  // 余额（元），十进制字符串以保留精度，如 "100.25"，可空。
  optional string balance = 8;
  // 生日，格式 YYYY-MM-DD，可空。
  optional string birth_date = 9;
  // 组织 UUID，可空。
  optional string org_id = 10;
  // 标签列表。
  repeated int32 tags = 11;
  // 自由结构 JSON 元数据。
  google.protobuf.Struct meta = 12;
  // 创建时间。服务端生成，只读。
  google.protobuf.Timestamp created_at = 13;
  // 最近修改时间。服务端生成，只读。
  google.protobuf.Timestamp updated_at = 14;
  // 软删除标记时间，通常为空。只读。
  google.protobuf.Timestamp deleted_at = 15;
}

// UserSet 是 ListUsers 返回的分页集合。
message UserSet {
  // 本页用户，顺序遵循查询中的 sort。
  repeated User items = 1;
  // 匹配的总行数。include_total 设为 false 时不出现。
  optional int64 total = 2;
  // 是否还有后续页。
  bool has_more = 3;
  // 游标模式下一页的游标；末页及无更多结果时为空。
  string next_cursor = 4;
  // offset 模式下的当前页码；游标模式下为 0。
  int32 page = 5;
}

// CreateUserRequest 是 UserService.CreateUser 的输入。
message CreateUserRequest {
  // 要创建的用户。id、status 与时间戳在输入中被忽略。
  User user = 1 [(google.api.field_behavior) = REQUIRED];
  // 初始密码。仅存储，不出现在任何读接口的响应中。
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

// GetUserRequest 是 UserService.GetUser 的输入。
message GetUserRequest {
  // 目标用户的服务端标识。
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// GetUserByEmailRequest 是 UserService.GetUserByEmail 的输入。
message GetUserByEmailRequest {
  // 目标用户的唯一邮箱。
  string email = 1 [(google.api.field_behavior) = REQUIRED];
}

// ListUsersRequest 是 UserService.ListUsers 的输入。
message ListUsersRequest {
  // 动态查询。协议见 query.v1.Query。
  query.v1.Query query = 1;
}

// UpdateUserRequest 是 UserService.UpdateUser 的输入。
message UpdateUserRequest {
  // 携带新字段值的用户。id 标识目标记录，必须设置。
  User user = 1 [(google.api.field_behavior) = REQUIRED];
}

// SetUserPasswordRequest 是 UserService.SetUserPassword 的输入。
message SetUserPasswordRequest {
  // 目标用户的服务端标识。
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
  // 新密码。
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

// DeleteUserRequest 是 UserService.DeleteUser 的输入。
message DeleteUserRequest {
  // 目标用户的服务端标识。
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
}
