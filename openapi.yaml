                 ALREADY_EXISTS。contact_name/contact_phone/default_locale 各不超过
                 64/32/10，default_locale 须为 BCP-47 基本形态（空则缺省 zh-CN）；
                 max_user_count 提供时必须 >0。status 只允许 0/1，创建缺省启用
                （optional 缺失才缺省，显式非 0/1 值返回 INVALID_ARGUMENT）。
            operationId: TenantService_CreateTenantSuper
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/tenant.v1.CreateTenantSuperRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/tenant.v1.Tenant'
