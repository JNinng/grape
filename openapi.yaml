                ListFeatureFlags 按动态查询协议返回一页功能开关（仅本租户可见）。
                 协议错误返回 INVALID_ARGUMENT。
            operationId: FeatureFlagService_ListFeatureFlags
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/query.v1.Query'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/config.v1.FeatureFlagSet'
    /v1/feature-flags/update:
        put:
            tags:
                - FeatureFlagService
            description: |-
                UpdateFeatureFlag 覆盖可变字段（name、description、is_enabled、
                 remark、status）。flag_key 与 tenant_id 创建后不可变，在输入中被
                 忽略。跨租户或已软删目标返回 NOT_FOUND。
            operationId: FeatureFlagService_UpdateFeatureFlag
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/config.v1.FeatureFlag'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/config.v1.FeatureFlag'
    /v1/feature-flags/{id}:
        get:
            tags:
                - FeatureFlagService
            description: |-
                GetFeatureFlag 按 id 查询单个功能开关。跨租户不可见等同不存在
                （NOT_FOUND）；已软删同样返回 NOT_FOUND。
            operationId: FeatureFlagService_GetFeatureFlag
            parameters:
                - name: id
                  in: path
                  description: 目标功能开关的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/config.v1.FeatureFlag'
        delete:
            tags:
                - FeatureFlagService
            description: |-
                DeleteFeatureFlag 软删除功能开关（deleted_at 置位）。跨租户或已软删
                 目标返回 NOT_FOUND（RLS 天然不可见）。软删后租户内 flag_key 可复用。
            operationId: FeatureFlagService_DeleteFeatureFlag
            parameters:
                - name: id
                  in: path
                  description: 目标功能开关的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/knowledge/documents/create:
        post:
            tags:
                - DocumentService
            description: CreateDocument 创建文本条目并摄取到向量存储（所属库必须可见）。
            operationId: DocumentService_CreateDocument
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/knowledge.v1.CreateDocumentRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledge.v1.Document'
    /v1/knowledge/documents/list:
        post:
            tags:
                - DocumentService
            description: |-
                ListDocuments 按动态查询协议返回一页调用方可见库内的条目（列表不
                 返回正文）。
            operationId: DocumentService_ListDocuments
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/query.v1.Query'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledge.v1.DocumentSet'
    /v1/knowledge/documents/search:
        post:
            tags:
                - DocumentService
            description: |-
                SearchDocuments 在调用方可见的知识库内做向量检索（与 Agent 检索工具
                 同一用例：可见库集合现场解析、条目参与、处于有效期内），权限码
                 sys:knowledge:query。命中按相似度降序，正文按原文返回，渲染方按普通
                 文本处理。
            operationId: DocumentService_SearchDocuments
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/knowledge.v1.SearchDocumentsRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledge.v1.SearchDocumentsReply'
    /v1/knowledge/documents/update:
        put:
            tags:
                - DocumentService
            description: |-
                UpdateDocument 覆盖条目可变字段（title/content/source_name/status/
                 有效期限）；正文变更时重新摄取；所属库不可见与不存在统一 404。
            operationId: DocumentService_UpdateDocument
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/knowledge.v1.Document'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledge.v1.Document'
    /v1/knowledge/documents/{id}:
        get:
            tags:
                - DocumentService
            description: GetDocument 按 id 查询条目（含正文；所属库不可见与不存在统一 404）。
            operationId: DocumentService_GetDocument
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledge.v1.Document'
        delete:
            tags:
                - DocumentService
            description: DeleteDocument 软删除条目并清理其 chunk；所属库不可见与不存在统一 404。
            operationId: DocumentService_DeleteDocument
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/knowledge/documents/{id}/chunks:
        get:
            tags:
                - DocumentService
            description: |-
                ListDocumentChunks 返回条目在向量存储中的实际分片（按分片序），
                 供管理页查看切分结果；分片正文按原文返回，不含向量。
            operationId: DocumentService_ListDocumentChunks
            parameters:
                - name: id
                  in: path
                  description: 条目 ID。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledge.v1.DocumentChunkSet'
    /v1/knowledge/documents/{id}/reindex:
        post:
            tags:
                - DocumentService
            description: ReindexDocument 重建指定条目的向量（正文与当前配置重新摄取）。
            operationId: DocumentService_ReindexDocument
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/knowledge.v1.ReindexDocumentRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledge.v1.Document'
    /v1/knowledge/libraries/create:
        post:
            tags:
                - LibraryService
            description: CreateLibrary 创建知识库（创建人缺省为归属人）。
            operationId: LibraryService_CreateLibrary
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/knowledge.v1.CreateLibraryRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledge.v1.Library'
    /v1/knowledge/libraries/list:
        post:
            tags:
                - LibraryService
            description: ListLibraries 按动态查询协议返回一页调用方可见的知识库。
            operationId: LibraryService_ListLibraries
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/query.v1.Query'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledge.v1.LibrarySet'
    /v1/knowledge/libraries/update:
        put:
            tags:
                - LibraryService
            description: |-
                UpdateLibrary 覆盖知识库可变字段（name/status/remark/embedding_model_key/
                 chunk_size/chunk_overlap/有效期限；chunk_delimiter 省略时保持原值）；
                 不可见与不存在统一 404。
            operationId: LibraryService_UpdateLibrary
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/knowledge.v1.Library'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledge.v1.Library'
    /v1/knowledge/libraries/{id}:
        get:
            tags:
                - LibraryService
            description: GetLibrary 按 id 查询调用方可见的知识库（不可见与不存在统一 404）。
            operationId: LibraryService_GetLibrary
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledge.v1.Library'
        delete:
            tags:
                - LibraryService
            description: |-
                DeleteLibrary 软删除知识库；存在未删除条目时拒绝；不可见与不存在
                 统一 404。
            operationId: LibraryService_DeleteLibrary
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/knowledge/libraries/{id}/documents:
        get:
            tags:
                - DocumentService
            description: |-
                ListLibraryDocuments 分页返回指定库下的条目（管理面子列表；宿主 id
                 在路径参数，规避动态协议整型过滤值的 JSON number 精度限制；库不可见
                 统一 404）。
            operationId: DocumentService_ListLibraryDocuments
            parameters:
                - name: id
                  in: path
                  description: 宿主知识库的标识。
                  required: true
                  schema:
                    type: string
                - name: page
                  in: query
                  description: 页码，缺省 1。
                  schema:
                    type: integer
                    format: int32
                - name: pageSize
                  in: query
                  description: 每页条数，缺省 20，上限 200。
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledge.v1.DocumentSet'
    /v1/knowledge/model-options:
        get:
            tags:
                - LibraryService
            description: |-
                ListModelOptions 返回当前租户可见的启用模型选项（按 kind 过滤），
                 权限码 sys:knowledge:query（知识库管理员无需 sys:model:query）。
            operationId: LibraryService_ListModelOptions
            parameters:
                - name: kind
                  in: query
                  description: 模型类别：text / embedding；空值返回全部。
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledge.v1.ModelOptionSet'
    /v1/menus/create:
        post:
            tags:
                - MenuService
            description: |-
                CreateMenuSuper 创建菜单（super 面：经部署面受控写函数写入）。父
                 菜单不存在/已删除/跨租户返回 INVALID_ARGUMENT 且不写入；permission_code
                 租户内未删除菜单间唯一，冲突返回 ALREADY_EXISTS。id、created_by/
                 updated_by 与时间戳在输入中被忽略。
            operationId: MenuService_CreateMenuSuper
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/perm.v1.CreateMenuSuperRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/perm.v1.Menu'
    /v1/menus/move:
        put:
            tags:
                - MenuService
            description: |-
                MoveMenuSuper 移动菜单到新父级（parent_id 未设置表示移为根）。
                 新父级不存在/已删除/跨租户返回 INVALID_ARGUMENT；移入自身子树
                （成环）返回 INVALID_ARGUMENT 且不写入。目标不存在返回 NOT_FOUND。
            operationId: MenuService_MoveMenuSuper
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/perm.v1.MoveMenuSuperRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/perm.v1.Menu'
    /v1/menus/tree:
        get:
            tags:
                - MenuService
            description: |-
                GetMenuTree 返回当前租户内全部未删除菜单的树形结构：parent_id 为
                 空的是根，子节点顺序与平铺列表一致（sort_order 升序，同序按 id
                 升序）；父引用缺失的行按根挂载（防御性兜底）。total 为节点总数。
            operationId: MenuService_GetMenuTree
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/perm.v1.MenuTreeReply'
    /v1/menus/update:
        put:
            tags:
                - MenuService
            description: |-
                UpdateMenuSuper 覆盖可变字段（name、status、icon、route_path、
                 component、permission_expr、sort_order、remark）。permission_code、
                 menu_type 与 parent_id 是身份/类型/结构列，在输入中被忽略：
                 结构变更走 MoveMenuSuper。目标不存在或跨租户返回 NOT_FOUND。
            operationId: MenuService_UpdateMenuSuper
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/perm.v1.Menu'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/perm.v1.Menu'
    /v1/menus/{id}:
        get:
            tags:
                - MenuService
            description: GetMenu 按 id 查询单个菜单。跨租户不可见等同不存在（NOT_FOUND）。
            operationId: MenuService_GetMenu
            parameters:
                - name: id
                  in: path
                  description: 目标菜单的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/perm.v1.Menu'
        delete:
            tags:
                - MenuService
            description: |-
                DeleteMenuSuper 软删除菜单（deleted_at 置位）。存在未删除直接子
                 菜单返回 HAS_CHILDREN（自叶向根逐层删）；目标不存在或跨租户返回
                 NOT_FOUND。已授权该菜单的角色映射行物理残留，不再产生功能权限。
            operationId: MenuService_DeleteMenuSuper
            parameters:
                - name: id
                  in: path
                  description: 目标菜单的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/models:
        get:
            tags:
                - ModelService
            description: ListModels 返回可见模型清单（本租户行 + 平台行，含停用；固定列表）。
            operationId: ModelService_ListModels
            parameters:
                - name: kind
                  in: query
                  description: 按类别过滤（text/embedding）；空值返回全部。
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
