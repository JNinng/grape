paths:
    /v1/auth/login:
        post:
            tags:
                - SessionService
            description: |-
                Login 校验用户名与口令并签发会话：口令按库内算法标识校验，通过
                 且非当前首选算法时透明重哈希（算法平滑升级）。失败统一返回
                 INVALID_CREDENTIALS（防枚举）；账号禁用返回 USER_DISABLED。
            operationId: SessionService_Login
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/session.v1.LoginRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/session.v1.LoginReply'
    /v1/auth/logout:
        post:
            tags:
                - SessionService
            description: |-
                Logout 撤销当前请求所持访问令牌所属的登录会话，会话级撤销同时使
                 该会话的刷新令牌失效。端点免认证（凭据就是令牌本身，且重复登出
                 必须幂等）：缺 Authorization 头或格式非法返回 SESSION_INVALID；
                 令牌对应会话已撤销、不存在或不匹配时同样成功返回（无内容可撤销，
                 也不泄露会话状态），重放登出不报错。
            operationId: SessionService_Logout
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/session.v1.LogoutRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/session.v1.LogoutReply'
    /v1/auth/refresh:
        post:
            tags:
                - SessionService
            description: |-
                Refresh 以刷新令牌轮换一对新令牌：访问令牌与刷新令牌都是独立
                 随机值，旧刷新令牌随即失效。刷新令牌无效/过期/已轮换返回
                 SESSION_INVALID。
            operationId: SessionService_Refresh
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/session.v1.RefreshRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
