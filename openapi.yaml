                id:
                    type: string
                    description: 服务端生成的标识。只读。
                status:
                    type: integer
                    description: 数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                    format: int32
                name:
                    type: string
                    description: 组名，租户内未删除用户组间唯一。
                code:
                    type: string
                    description: 组编码，租户内未删除用户组间唯一；创建后不可变。
                remark:
                    type: string
                    description: 备注，可空。
                ownerUserId:
