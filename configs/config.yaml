server:
  http:
    addr: 0.0.0.0:8000
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
data:
  database:
    # 运行角色 grape_u（非超级用户，真实承受 RLS；授权见 sqlc/rls.sql）。
    # 指向已按 sqlc/README「数据库部署执行顺序」完成部署的库。
    source: ${DATABASE_SOURCE:postgres://grape_u:grape_u_pwd@127.0.0.1:5432/grape}
    # Log every executed statement. Development only.
    debug: true
auth:
  # 过渡期身份：认证纵切落地前，租户与操作者从这里构造 AuthContext；
  # 落地后仅替换身份来源。指向种子数据里的全租户管理员。
  default_tenant_id: t-super-01
  default_user_id: 1
