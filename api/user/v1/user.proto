syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "query/v1/query.proto";

option go_package = "grape/api/user/v1;v1";
option java_multiple_files = true;
option java_package = "io.grpc.examples.user.v1";
option java_outer_classname = "UserProto";

// UserService 提供用户管理。List 走动态查询协议，过滤/排序/投影/分页
// 能力由存储层 schema 注释 DSL 声明。读写都在服务端注入的租户与数据
// 范围内执行（@scope 守卫）：范围不可见的数据等同不存在（NOT_FOUND），
// 写侧判定不通过返回 FORBIDDEN。
service UserService {
  // CreateUser 创建用户并设置初始密码（服务端哈希后落库）。
  // 请求携带的归属三元组经库内 fn_can_set_owner 校验（归属对象存在、
  // 启用且在操作者可见范围内），不通过返回 FORBIDDEN。
  // 租户内 name/email/phone 唯一，冲突返回 ALREADY_EXISTS。
  rpc CreateUser (CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users/create"
      body: "*"
    };
  }

  // GetUser 按 id 查询单个用户。数据范围不可见等同不存在。
  rpc GetUser (GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/users/{id}"
    };
  }

  // ListUsers 按动态查询协议返回一页用户。过滤表达式非法、字段未知、
  // 操作符不允许、条件冲突、跨表游标均返回 INVALID_ARGUMENT。
  rpc ListUsers (ListUsersRequest) returns (UserSet) {
    option (google.api.http) = {
      post: "/v1/users/list"
      body: "query"
    };
  }

  // UpdateUser 覆盖可变字段（name、nickname、email、phone、remark、
  // locale、status）。password、归属三元组与时间戳不由本接口写入。
  rpc UpdateUser (UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      put: "/v1/users/update"
      body: "user"
    };
  }

  // SetUserPassword 设置新密码（服务端哈希后落库）。
  // 密码不出现在任何读接口的响应中。
  rpc SetUserPassword (SetUserPasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/users/password"
      body: "*"
    };
  }

  // DeleteUser 软删除用户（deleted_at 置位，租户内唯一键随之可复用）。
  rpc DeleteUser (DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/users/{id}"
    };
  }

  // AssignRoles 把多个角色分配给目标用户：先按 ID 锁定目标（不判可见性，
  // 不存在返回 NOT_FOUND），再经库内批量判定（fn_can_assign_role：角色
  // 可见性 + 目标部门范围 + 分配权限码），全部通过才写入映射；任一不通过
  // 整批拒绝（FORBIDDEN）。已拥有的角色跳过，返回实际新增条数。
  rpc AssignRoles (AssignRolesRequest) returns (AssignRolesReply) {
    option (google.api.http) = {
      post: "/v1/users/assign-roles"
      body: "*"
    };
  }

  // TransferUserOwner 修改用户的归属三元组，两头校验：该用户本身
  // 有权操作，且新归属的人/部门/组在可见范围内，否则 FORBIDDEN。
  // 归属字段传 null 表示清掉该归属。
  rpc TransferUserOwner (TransferUserOwnerRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users/transfer-owner"
      body: "*"
    };
  }

  // ListAssignableRoles 返回目标用户可分配、且尚未拥有的活跃角色
  //（操作者按 fn_can_assign_role 判定：角色可见性 + 目标部门范围 +
  // 分配权限码）。分配不要求目标用户可见；目标不存在/软删返回
  // NOT_FOUND。
  rpc ListAssignableRoles (ListAssignableRolesRequest) returns (query.v1.OptionSet) {
    option (google.api.http) = {
      post: "/v1/users/assignable-roles"
      body: "*"
    };
  }

  // ListUserRoles 返回目标用户当前可管理范围的角色集合（locked 角色
  // 只计数不暴露明细）与版本号；目标不存在/软删返回 NOT_FOUND
  //（分配读面不要求目标可见）。
  rpc ListUserRoles (ListUserRolesRequest) returns (UserRoleSet) {
    option (google.api.http) = {
      get: "/v1/users/{user_id}/roles"
    };
  }

  // SetUserRoles 用「管理范围内的整组替换」写入目标用户的角色：请求
  // 只表达调用方可管理范围内的目标集合，范围外（locked）角色原样保留；
  // 新增按 fn_can_assign_role 判定，移除按 fn_can_revoke_role 软删（放宽
  // 角色/目标状态校验）；任一拒绝、请求触及 locked 或版本不一致整批
  // 回滚。目标按 ID 定位（分配不要求目标可见），不存在返回 NOT_FOUND。
  rpc SetUserRoles (SetUserRolesRequest) returns (UserRoleSet) {
    option (google.api.http) = {
      post: "/v1/users/set-roles"
      body: "*"
    };
  }

  // ListOwnerUserOptions 返回归属用户候选（操作者可见范围内的活跃用户）。
  rpc ListOwnerUserOptions (ListOwnerOptionsRequest) returns (query.v1.OptionSet) {
    option (google.api.http) = {
      post: "/v1/users/owner-user-options"
      body: "*"
    };
  }

  // ListOwnerDeptOptions 返回归属部门候选（操作者可见范围内的活跃部门）。
  rpc ListOwnerDeptOptions (ListOwnerOptionsRequest) returns (query.v1.OptionSet) {
    option (google.api.http) = {
      post: "/v1/users/owner-dept-options"
      body: "*"
    };
  }

  // ListOwnerGroupOptions 返回归属用户组候选（操作者可见范围内的活跃组）。
  rpc ListOwnerGroupOptions (ListOwnerOptionsRequest) returns (query.v1.OptionSet) {
    option (google.api.http) = {
      post: "/v1/users/owner-group-options"
      body: "*"
    };
  }
}

// User 是用户的规范表示。password 列为 @internal，不跨越 API 边界；
// 审计列与时间戳只读。
message User {
  // 服务端生成的标识。只读。
  int64 id = 1;
  // 数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
  optional int32 status = 2;
  // 用户名，租户内唯一。
  string name = 3;
  // 昵称。
  string nickname = 4;
  // 邮箱，租户内唯一，可空。
  optional string email = 5;
  // 手机号，租户内唯一，可空。
  optional string phone = 6;
  // 备注，可空。
  optional string remark = 7;
  // 语言偏好（BCP-47），如 zh-CN。缺省 zh-CN。
  string locale = 8;
  // 归属用户。读接口可见，仅 CreateUser（经 fn_can_set_owner 校验）与
  // TransferUserOwner 可写。
  optional int64 owner_user_id = 9;
  // 归属部门。读接口可见，仅 CreateUser（经 fn_can_set_owner 校验）与
  // TransferUserOwner 可写。
  optional int64 owner_dept_id = 10;
  // 归属用户组。读接口可见，仅 CreateUser（经 fn_can_set_owner 校验）与
  // TransferUserOwner 可写。
  optional int64 owner_user_group_id = 11;
  // 创建人。只读。
  int64 created_by = 12;
  // 更新人。只读。
  int64 updated_by = 13;
  // 创建时间。服务端生成，只读。
  google.protobuf.Timestamp created_at = 14;
  // 最近修改时间。服务端生成，只读。
  google.protobuf.Timestamp updated_at = 15;
  // 软删除标记时间，通常为空。只读。
  google.protobuf.Timestamp deleted_at = 16;
}

// UserSet 是 ListUsers 返回的分页集合。
message UserSet {
  // 本页用户，顺序遵循查询中的 sort；零命中时键省略（空集合不输出），客户端按空数组处理。
  repeated User items = 1;
  // 匹配的总行数。include_total 设为 false 时不出现，JSON 响应中未设置时键省略。
  optional int64 total = 2;
  // 是否还有后续页；JSON 响应中为 false 时键省略，客户端按 false 处理。
  bool has_more = 3;
  // 游标模式下一页的游标；末页及无更多结果时为空，JSON 响应中为空串时键省略。
  string next_cursor = 4;
  // offset 模式下的当前页码；游标模式下为 0，JSON 响应中为 0 时键省略。
  int32 page = 5;
}

// CreateUserRequest 是 UserService.CreateUser 的输入。
message CreateUserRequest {
  // 要创建的用户。id、created_by/updated_by 与时间戳在输入中被忽略。
  User user = 1 [(google.api.field_behavior) = REQUIRED];
  // 初始密码。仅存储，不出现在任何读接口的响应中。
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

// GetUserRequest 是 UserService.GetUser 的输入。
message GetUserRequest {
  // 目标用户的服务端标识。
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// ListUsersRequest 是 UserService.ListUsers 的输入。
message ListUsersRequest {
  // 动态查询。协议见 query.v1.Query。
  query.v1.Query query = 1;
}

// UpdateUserRequest 是 UserService.UpdateUser 的输入。
message UpdateUserRequest {
  // 携带新字段值的用户。id 标识目标记录，必须设置；归属三元组在
  // 输入中被忽略（走 TransferUserOwner）。
  User user = 1 [(google.api.field_behavior) = REQUIRED];
}

// SetUserPasswordRequest 是 UserService.SetUserPassword 的输入。
message SetUserPasswordRequest {
  // 目标用户的服务端标识。
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
  // 新密码。
  string password = 2 [(google.api.field_behavior) = REQUIRED];
}

// DeleteUserRequest 是 UserService.DeleteUser 的输入。
message DeleteUserRequest {
  // 目标用户的服务端标识。
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
}

// AssignRolesRequest 是 UserService.AssignRoles 的输入。
message AssignRolesRequest {
  // 被分配的目标用户。
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 要分配的角色列表；重复项去重。
  repeated int64 role_ids = 2 [(google.api.field_behavior) = REQUIRED];
}

// AssignRolesReply 是 UserService.AssignRoles 的输出。
message AssignRolesReply {
  // 实际新增的映射条数（目标用户已拥有的角色跳过）。
  int64 added = 1;
}

// TransferUserOwnerRequest 是 UserService.TransferUserOwner 的输入。
message TransferUserOwnerRequest {
  // 目标用户的服务端标识。
  int64 id = 1 [(google.api.field_behavior) = REQUIRED];
  // 新归属用户；null 表示清掉该归属。
  optional int64 owner_user_id = 2;
  // 新归属部门；null 表示清掉该归属。
  optional int64 owner_dept_id = 3;
  // 新归属用户组；null 表示清掉该归属。
  optional int64 owner_user_group_id = 4;
}

// ListAssignableRolesRequest 是 UserService.ListAssignableRoles 的输入。
message ListAssignableRolesRequest {
  // 目标用户的服务端标识（决定可分配角色集与已拥有过滤）。
  int64 target_user_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 关键字与分页。
  query.v1.OptionQuery query = 2;
}

// ListUserRolesRequest 是 UserService.ListUserRoles 的输入。
message ListUserRolesRequest {
  // 目标用户的服务端标识。
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
}

// SetUserRolesRequest 是 UserService.SetUserRoles 的输入。
message SetUserRolesRequest {
  // 目标用户的服务端标识。
  int64 user_id = 1 [(google.api.field_behavior) = REQUIRED];
  // 只表达调用方可管理范围内的目标集合；不得包含 locked 角色。
  repeated int64 role_ids = 2;
  // ListUserRoles 返回的 version；必填，不一致返回 409。
  string expected_version = 3 [(google.api.field_behavior) = REQUIRED];
}

// ListOwnerOptionsRequest 是归属候选三端点的输入。
message ListOwnerOptionsRequest {
  // 关键字与分页。
  query.v1.OptionQuery query = 1;
}

// UserRoleSet 是 UserService.ListUserRoles / SetUserRoles 的输出。
message UserRoleSet {
  // 当前可管理范围的角色（assigned=true）；按名称、ID 稳定排序。
  repeated query.v1.Option items = 1;
  // locked 角色数量（不在调用方管理范围的既有角色；不暴露明细）。
  int64 unmanaged_count = 2;
  // 含 user_id 与排序后可管理角色 ID 的 hash；提交 SetUserRoles 时原样回传。
  string version = 3;
}
