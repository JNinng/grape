                    description: 目标用户组的服务端标识。
                userIds:
                    type: array
                    items:
                        type: string
                    description: 要移除的用户 ID 列表；重复项去重。
            description: |-
                RemoveUserGroupMembersRequest 是 UserGroupService.RemoveUserGroupMembers
                 的输入。
        org.v1.UserGroup:
            type: object
