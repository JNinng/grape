                 过滤表达式非法、字段未知、操作符不允许、条件冲突、跨表游标均返回
                 INVALID_ARGUMENT。
            operationId: RoleService_ListRoles
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/query.v1.Query'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/perm.v1.RoleSet'
