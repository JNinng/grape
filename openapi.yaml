        org.v1.UserGroupSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.UserGroup'
                    description: 本页用户组，顺序遵循查询中的 sort；零命中时键省略（空集合不输出），客户端按空数组处理。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现，JSON 响应中未设置时键省略。
                hasMore:
                    type: boolean
                    description: 是否还有后续页；JSON 响应中为 false 时键省略，客户端按 false 处理。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空，JSON 响应中为空串时键省略。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0，JSON 响应中为 0 时键省略。
