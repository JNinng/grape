            type: object
            properties:
                id:
                    type: string
                    description: 服务端生成的标识。只读。
                status:
                    type: integer
                    description: 数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                    format: int32
                name:
                    type: string
                    description: 用户名，租户内唯一。
                nickname:
                    type: string
                    description: 昵称。
                email:
                    type: string
                    description: 邮箱，租户内唯一，可空。
                phone:
                    type: string
