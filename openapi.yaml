                - ModelService
            description: CreateModel 创建本租户模型行。
            operationId: ModelService_CreateModel
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/model.v1.CreateModelRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/model.v1.Model'
    /v1/models/platform/create:
