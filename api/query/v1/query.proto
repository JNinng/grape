syntax = "proto3";

package query.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";

option go_package = "grape/api/query/v1;v1";
option java_multiple_files = true;
option java_package = "io.grpc.examples.query.v1";
option java_outer_classname = "QueryProto";

// Query 是动态 List 查询协议，镜像存储层的 dynq.Query。
// where 中多条条件恒为 AND 组合，不支持 OR 与条件分组。
message Query {
  // 投影字段列表（小驼峰）。显式空数组、@internal 字段、被禁用字段与未知字段
  // 均被拒绝；pk 与表级默认排序键会强制并入查询结果。
  repeated string fields = 1;
  // 过滤条件，多条之间恒为 AND。
  repeated Condition where = 2;
  // 排序项，按顺序生效；为空时回落到表级默认排序。
  repeated SortItem sort = 3;
  // 分页输入。
  Pagination pagination = 4;
}

// Condition 是单个过滤条件。
//
// value 与 right_value 为 JSON 值，接受形态由字段数据类型与操作符决定：
// 整型字段的 eq 接受数字；between 在 value 放下界、right_value 放上界；
// in / not_in 接受数组；is_null / not_null 不需要值。
message Condition {
  // 字段键，小驼峰，如 createdAt。
  string field = 1;
  // 操作符：eq、neq、in、not_in、gt、gte、lt、lte、between、contains、
  // prefix、suffix、has、is_null、not_null。每列可用的操作符集合由 schema
  // 声明并在服务端校验。
  string op = 2;
  // 左操作数（between 时为下界）。
  google.protobuf.Value value = 3;
  // between 的上界。
  google.protobuf.Value right_value = 4;
}

// SortItem 是单个排序项。
message SortItem {
  // 字段键，小驼峰。仅 @sortable 列被接受。
  string field = 1;
  // 排序方向：asc（默认）或 desc。
  string order = 2;
}

// Pagination 是分页输入。page 从 1 开始，为 offset 模式；after 非空即切换到
// 游标模式，且必须携带同表上一页返回的 next_cursor。游标按表做指纹校验，
// 跨资源的游标会被拒绝。
message Pagination {
  // 页码，从 1 开始。offset 模式。
  optional int32 page = 1;
  // 每页条数。未设置时回落到表级默认值；上限受表级最大值约束。
  optional int32 page_size = 2;
  // 上一页响应的 next_cursor。游标模式；与 page 互斥。
  optional string after = 3;
  // 是否计算 total。缺省为 true。
  optional bool include_total = 4;
}

// OptionQuery 是可搜索选项来源的查询输入：关键字 + offset 分页。匹配字段
// 由来源定义（角色匹配 name/code，用户匹配 name/nickname，部门匹配 name，
// 用户组匹配 name/code）；越界分页由服务端归一化。
message OptionQuery {
  // 关键字；空串不过滤。大小写不敏感的子串匹配。
  string keyword = 1;
  // 页码，从 1 开始；缺省 1。
  int32 page = 2;
  // 每页条数；缺省 20，上限 100。
  int32 page_size = 3;
}

// Option 是选择器候选项。当前来源的 value 均为 int64 ID 的十进制字符串
// （前端不丢精度）；enabled/reason 为前向兼容字段，v1 恒 enabled=true、
// reason 为空。
message Option {
  // 选项值；当前来源均为 int64 ID 的十进制字符串。
  string value = 1;
  // 展示文本。
  string label = 2;
  // 是否可选；v1 恒 true。
  bool enabled = 3;
  // enabled=false 时的原因说明；v1 为空。
  string reason = 4;
  // 目标用户已拥有（角色场景）；owner 候选恒 false。
  bool assigned = 5;
}

// OptionSet 是选项来源的一页结果。total v1 不返回（以 limit+1 判定
// has_more），保留字段供未来来源使用。
message OptionSet {
  // 本页候选项；零命中时键省略（空集合不输出），客户端按空数组处理。
  repeated Option items = 1;
  // 是否还有后续页。
  bool has_more = 2;
  // 匹配总数；v1 不使用。
  optional int64 total = 3;
  // 当前页码；服务端归一化后的值。
  int32 page = 4;
}

// QueryService 提供动态 List 的能力 schema 出口：前端据此渲染查询组件。
// schema 是（生成期元数据，能力收窄选项）的确定性纯函数，同一资源恒产出
// 字节级相同结果，内容 hash 可作 ETag。资源仅收录已暴露动态 List 的表；
// 本服务为能力元数据读面，认证后即可访问，不设功能权限码。
service QueryService {
  // GetListSchema 返回资源的 List 能力 schema（字段、操作符、排序、分页配置）。
  // 请求的资源未收录时返回 INVALID_ARGUMENT。
  rpc GetListSchema (GetListSchemaRequest) returns (ListSchema) {
    option (google.api.http) = {
      get: "/v1/query/schema"
    };
  }
}

// GetListSchemaRequest 是 QueryService.GetListSchema 的输入。
message GetListSchemaRequest {
  // 资源名（存储表名，如 sys_user）。仅收录已暴露动态 List 的资源。
  string resource = 1 [(google.api.field_behavior) = REQUIRED];
}

// ListSchema 是动态 List 查询的能力契约，镜像存储层 dynq.ResourceSchema。
// 被完全禁用（或 @internal）的字段不出现在 fields 中；JSON 键统一小驼峰，
// 与存储层 schema 的 JSON 协议一致。
message ListSchema {
  // 资源名（存储表名）。
  string resource = 1;
  // schema 内容 hash（确定性纯函数），可作 ETag 缓存协商。
  string hash = 2;
  // 可查询字段的能力列表；无字段时键省略（空集合不输出），客户端按空数组
  // 处理。
  repeated ListSchemaField fields = 3;
  // 默认排序；查询未指定 sort 时的服务端回落。无默认排序时键省略（空集合
  // 不输出），客户端按空数组处理。
  repeated ListSchemaSort default_sort = 4;
  // 分页参数。
  ListSchemaPagination pagination = 5;
}

// ListSchemaField 是单个查询字段的能力契约。
message ListSchemaField {
  // 字段键，小驼峰，与 Query.where/sort/fields 中的字段键一致。
  string field = 1;
  // 展示文本。
  string label = 2;
  // 数据类型：string / integer / decimal / boolean / date / datetime / enum 等。
  string data_type = 3;
  // 是否可空。false 时 JSON 响应键省略。
  bool nullable = 4;
  // 是否可排序（sort 接受该字段）。false 时 JSON 响应键省略。
  bool sortable = 5;
  // 列头可显隐交互提示。false 时 JSON 响应键省略。
  bool hideable = 6;
  // hideable 的过渡期旧键，与 hideable 恒同值；新代码不得依赖。false 时
  // JSON 响应键省略。
  bool selectable = 7;
  // 该字段可用的过滤操作符集合（eq、neq、in、not_in、gt、gte、lt、lte、
  // between、contains、prefix、suffix、has、is_null、not_null）。空集合时
  // 键省略，客户端按空数组处理。
  repeated string ops = 8;
  // 枚举字段的合法线上枚举名。JSON 键为 enum；非枚举字段时键省略（空集合
  // 不输出），客户端按空数组处理。
  repeated string enum_values = 9 [json_name = "enum"];
  // 选项数据源为远程接口的声明；为空表示选项取静态清单（enum 或
  // options）。未声明时 JSON 响应键省略。
  ListSchemaFieldAPI api = 10;
  // 字段描述（枚举值释义、单位说明等），镜像存储层 @desc 注解。为空时
  // JSON 响应键省略。
  string desc = 11;
  // 静态字典选项，镜像存储层 @options 注解，渲染下拉/多选值控件；value
  // 按字段 data_type 定型为 number 或 string。未声明时 JSON 响应键省略
  // （空集合不输出）。与 api 互斥：一个字段的选项只有一种来源。
  repeated ListSchemaFieldOption options = 12;
}

// ListSchemaFieldOption 是静态字典选项的单个键值对。
message ListSchemaFieldOption {
  // 选项值，仅整数或字符串，与字段 data_type 定型一致；整数按 JSON
  // number 表达，限制在 JS 安全整数范围内。
  google.protobuf.Value value = 1;
  // 选项展示文本。
  string label = 2;
}

// ListSchemaFieldAPI 是 @api 字段的选项数据源契约：where 值控件的选项经
// GET {endpoint} 拉取，响应 body 为 items 数组，每项含 value_key / label_key
// 命名的顶层字段。
//
// 本声明只服务 query-filter 的字段级选项来源；用户分配选择器使用的
// OptionQuery / Option / OptionSet 是并行的独立接口，不接入本字段
// （选择器端点按分配动作设权限码，不复用动态查询的 @api 解析）。
message ListSchemaFieldAPI {
  // 相对前端 baseURL 的路径；查询参数由前端按协议拼接。
  string endpoint = 1;
  // items 中选项值的字段名（顶层）。
  string value_key = 2;
  // items 中展示文本的字段名（顶层）。
  string label_key = 3;
  // 交互模式：single | multi | search。
  string mode = 4;
}

// ListSchemaSort 是默认排序项。
message ListSchemaSort {
  // 字段键，小驼峰。
  string field = 1;
  // true = desc。false 时 JSON 响应键省略。
  bool desc = 2;
}

// ListSchemaPagination 是分页双模式与 total 计算能力。
message ListSchemaPagination {
  // 每页默认条数。
  int32 default_page_size = 1;
  // 每页最大条数。
  int32 max_page_size = 2;
  // 支持的分页模式：offset、cursor。空集合时键省略，客户端按空数组处理。
  repeated string modes = 3;
  // 是否支持 include_total=false 跳过 COUNT。false 时 JSON 响应键省略。
  bool include_total = 4;
}
