                ownerUserGroupId:
                    type: string
                    description: 归属用户组。读接口可见，仅 TransferUserOwner 可写。
                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。服务端生成，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。服务端生成，只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间，通常为空。只读。
                    format: date-time
            description: |-
                User 是用户的规范表示。password 列为 @hidden，不跨越 API 边界；
                 审计列与时间戳只读。
        user.v1.UserSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/user.v1.User'
                    description: 本页用户，顺序遵循查询中的 sort。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现。
                hasMore:
                    type: boolean
                    description: 是否还有后续页。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空。
                page:
