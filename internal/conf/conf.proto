syntax = "proto3";
package kratos.api;

option go_package = "grape/internal/conf;conf";

import "google/protobuf/duration.proto";

// Bootstrap 是服务启动配置的根结构，对应 configs/config.yaml。
message Bootstrap {
  // HTTP / gRPC 服务器配置。
  Server server = 1;
  // 存储配置。
  Data data = 2;
  // 登录配置（请求未指明租户时的回落租户）。
  Auth auth = 3;
  // Agent 服务配置（LLM provider 与 AG-UI 暴露形态）。
  Agent agent = 4;
  // 向量检索设施配置。
  Vector vector = 5;
  // 遥测配置（OpenTelemetry trace）。
  Telemetry telemetry = 6;
}

// Telemetry 是 OpenTelemetry 遥测配置：SDK 开关与 OTLP 导出目标。
// 由 internal/telemetry 装配层消费；enabled=false 完全 noop（不构造
// exporter、不发起任何连接）。采样比例按 trace-id 确定性判定：同一
// trace-id 在多实例上决策一致，链路不因实例而断裂；x-trace-id 响应头
// 与日志 trace_id 字段不受采样影响，恒可用。
message Telemetry {
  // 是否启用 OTel SDK。启用前须确认 endpoint 可达，否则导出失败只记
  // 内部日志不影响请求。
  bool enabled = 1;
  // OTLP gRPC exporter 地址，如 localhost:4317。启用时必填。
  string endpoint = 2;
  // exporter 是否走明文（无 TLS）。本地 collector 通常为 true。
  bool insecure = 3;
  // 根 span 采样比例，0~1；未设置取 1.0（全采）。采样器为裸
  // TraceIDRatioBased（非 ParentBased 包装）：决策独立于父 span 的
  // sampled 标志；需要跟随上游采样决策时在装配处包 ParentBased。
  double sampler_ratio = 4;
  // 资源属性 service.name；空取 "grape"。
  string service_name = 5;
  // 资源属性 service.version；空省略该属性。
  string service_version = 6;
}

// Vector 是向量检索设施（pgvector）的配置：表结构与维度由部署 DDL
// （sqlc/agent_vector.sql）定，本段必须与之保持一致，装配期探针校验
// 不一致即拒绝启动。由 internal/data/pg_sqlc 的向量仓储构造函数消费。
message Vector {
  // 是否启用向量存储设施。启用前须先完成 agent_vector.sql 部署；
  // 未启用时向量仓储按设施缺失拒绝所有调用，不触库。
  bool enabled = 1;
  // embedding 维度，必须与 DDL 列类型 vector(维度) 一致（默认部署为
  // 1024）。启用时必填。
  int32 dimension = 2;
  // 向量表名（agent schema 内、agent_ 前缀），必须与部署 DDL 一致；
  // 留空取默认 agent_document。
  string table_name = 3;
}

// Agent 是 Agent 服务（AG-UI + ack）的配置：应用名、LLM provider 与
// AG-UI 暴露参数。由 internal/agent 框架适配层消费。
message Agent {
  // 应用名：core runner、AG-UI 与 ack 三者共用的会话存储键组成部分，
  // 必须一致，否则会话定位失败。
  string app_name = 1;

  // LLM 是模型 provider 配置（OpenAI 兼容直连）。
  message LLM {
    // provider 变体（openai / deepseek / qwen / minimax / kimi）。
    // 留空按 openai 处理；base_url 为空时由框架按变体取内置默认端点。
    string provider = 1;
    // OpenAI 兼容端点；留空用框架内置默认。
    string base_url = 2;
    // API key，经 ${ENV:...} 占位注入，不落默认配置。
    string api_key = 3;
    // 模型名。
    string model = 4;
    // 单次模型调用超时；未设置用框架默认。
    google.protobuf.Duration timeout = 5;
  }
  LLM llm = 2;

  // AGUI 是 AG-UI 协议端点的暴露配置。
  message AGUI {
    // 路由前缀（如 /agui）；chat 挂在前缀根，/history 与 /cancel 同前缀。
    string base_path = 1;
    // 单次运行超时（服务端兜底，未决确认最终由它结算为拒绝）。
    google.protobuf.Duration timeout = 2;
    // SSE 心跳间隔，保持中间设备不掐空闲流。
    google.protobuf.Duration heartbeat_interval = 3;
  }
  AGUI agui = 3;

  // SessionStorage 是会话存储（框架 session/postgres，独立 schema agent
  // + agent_ 表前缀）的保留策略。表由部署面预建（sqlc/agent_session.sql），
  // 运行期不做 DDL。各项 0 值语义见字段注释。
  message SessionStorage {
    // 会话状态与事件保留时长；0 = 永不过期（框架默认）。
    google.protobuf.Duration session_ttl = 1;
    // track 事件（AG-UI /history 快照流）保留时长；0 = 沿用
    // session_ttl（框架默认：该项未显式设置时跟随会话 TTL）。
    google.protobuf.Duration track_event_ttl = 2;
    // 应用级 state 保留时长；0 = 永不过期（框架默认）。grape 不用
    // app 级 state 存租户业务数据，此表仅供框架内部机制使用。
    google.protobuf.Duration app_state_ttl = 3;
    // 用户级 state 保留时长；0 = 永不过期（框架默认）。
    google.protobuf.Duration user_state_ttl = 4;
  }
  SessionStorage session_storage = 4;

  // Compression 是请求侧上下文压缩配置（框架三个 Pass，TODO §1.1）。
  // 压缩只作用于请求投影副本，session 事件流始终保留原文；占位符携带
  // event_id 恢复引用，配合 session_load 可按需取回原文。
  message Compression {
    // 总开关：false（默认）时不改写任何工具结果，下列阈值全部失效。
    bool enabled = 1;
    // Pass 1：历史工具结果超过该 token 估算值整体替换为占位符；
    // 0 = 用框架默认 1024。
    int32 tool_result_max_tokens = 2;
    // Pass 1：最近 N 个完成请求受保护不参与历史压缩；
    // 0 = 用框架默认 1。
    int32 keep_recent_requests = 3;
    // Pass 2：单条工具结果（含当前请求）超过该 token 估算值做头尾
    // 保留截断；0 = 关闭（框架默认；框架推荐值 8192 仅是参考，不自动生效）。
    int32 oversized_tool_result_max_tokens = 4;
    // Pass 0：命中工具名的结果强制替换占位符（仍受最近请求保护窗口
    // 约束，keep_tool_names 优先于本名单）。
    repeated string force_clean_tool_names = 5;
    // 定向保留：命中工具名的结果不参与任何压缩（如订单创建/修改结果）。
    repeated string keep_tool_names = 6;
  }
  Compression compression = 5;

  // Summarization 是会话摘要的配置位：当前恒关闭。启用需要额外的
  // summarizer 模型与摘要注入模式（system/user，user 模式参与 token
  // 预算裁剪）选型，B2 未实现；占位以保证后续启用不改配置结构。
  message Summarization {
    bool enabled = 1;
  }
  Summarization summarization = 6;
}

// Auth 是登录的过渡期配置：请求未指明租户时的回落租户（多租户登录
// 形态确定后由服务端解析替代）。
message Auth {
  // 登录未指明租户时的回落租户。
  string default_tenant_id = 1;
}

// Server 是传输层服务器配置。
message Server {
  // HTTP 服务器配置。
  message HTTP {
    // 监听网络类型，如 tcp。
    string network = 1;
    // 监听地址，如 0.0.0.0:8000。
    string addr = 2;
    // 入站请求超时，作用于传输层为每个请求派生的 ctx。设为 0 表示
    // 不在传输层限时不截断长流（SSE），普通路由改由 request_timeout
    // 经中间件链施加。
    google.protobuf.Duration timeout = 3;
    // 路由级请求超时：对非 agent 前缀（AG-UI / ack）的 HTTP 路由由
    // server 层超时中间件施加，恢复被 timeout: 0s 关掉的普通端点限时。
    google.protobuf.Duration request_timeout = 4;
    // CORS 是跨域资源共享的可选配置。默认关闭：不输出任何 CORS 头。
    // 开启时所有链内响应恒带 Access-Control-Expose-Headers:
    // x-trace-id, x-request-id（E1 明文要求，前端可读链路 ID）。
    CORS cors = 5;
  }
  // CORS 是跨域资源共享配置，由 internal/middleware 的轻量 CORS 中间件
  // 消费（不引入第三方 CORS 库）。预检请求在链内短路（agent 前缀路由）
  // 或经 server 层的 405 兜底 handler 应答（生成代码路由）。
  message CORS {
    // 是否启用。启用时 allowed_origins 必填，构造期校验，非法拒绝启动。
    bool enabled = 1;
    // 允许跨域的 origin 精确清单（scheme://host[:port]），条目 "*"
    // 表示允许任意 origin。启用时必填。
    repeated string allowed_origins = 2;
    // 预检结果缓存时长（Access-Control-Max-Age）；未设置不发该头。
    google.protobuf.Duration max_age = 3;
  }
  // gRPC 服务器配置。
  message GRPC {
    // 监听网络类型，如 tcp。
    string network = 1;
    // 监听地址，如 0.0.0.0:9000。
    string addr = 2;
    // 请求超时时间。
    google.protobuf.Duration timeout = 3;
  }
  // Trace 是链路标识配置。
  message Trace {
    // 可信上游网段（CIDR，如 127.0.0.1/32）。仅这些来源发来的合法
    // traceparent 才被继承；为空表示不信任任何上游，一律新建根。
    repeated string trusted_networks = 1;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  // 链路标识配置。
  Trace trace = 3;
}

// Data 是存储层配置。
message Data {
  // PostgreSQL 数据库连接配置，按用途分槽位；过渡期各槽指向同一实例，
  // 连接选择收在 wire 装配层，按用途注入对应句柄。
  message Database {
    // Slot 是单一用途槽位的连接配置。
    message Slot {
      // 连接 DSN，如 postgres://user:pass@127.0.0.1:5432/db。
      string source = 1;
      // 记录每条执行的语句与参数。仅开发环境开启。
      bool debug = 2;
    }
    // 业务主库槽位：领域数据的唯一读写点。
    Slot master = 1;
    // 系统库槽位：平台级设施（将来全局配置/任务状态等）；过渡期与
    // master 指向同一实例。
    Slot system = 2;
  }
  Database database = 1;
}
