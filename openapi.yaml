        perm.v1.Menu:
            type: object
            properties:
                id:
                    type: string
                    description: 服务端生成的标识。只读。
                status:
                    type: integer
                    description: |-
                        数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                         停用的菜单不再产生功能权限。
