                 data_scope 与 scope_dept_id 在输入中被忽略：编码与类型是身份列，
                 数据范围配置走 SetRoleDataScope。
            operationId: RoleService_UpdateRole
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/perm.v1.Role'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
