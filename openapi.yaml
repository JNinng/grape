        perm.v1.GetMyPermissionsReply:
            type: object
            properties:
                codes:
                    type: array
                    items:
                        type: string
                    description: |-
                        当前用户持有的功能权限码集合（去重升序）；为空时键省略（空集合不
                         输出），客户端按空数组处理。
