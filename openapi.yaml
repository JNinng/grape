            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/perm.v1.GetMyPermissionsReply'
    /v1/profile:
        get:
            tags:
                - UserService
            description: |-
                GetMyProfile 返回当前认证用户的个人资料。目标恒取认证身份，请求不
                 携带定位参数，也不设功能权限码；只暴露个人中心可维护的字段。
            operationId: UserService_GetMyProfile
            responses:
                "200":
