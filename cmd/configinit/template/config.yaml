# 服务启动配置模板，由 cmd/configinit 经 go:embed 输出（make config-init）。
# 本文件是配置模板的单一事实源，与 internal/conf/conf.proto 对应；
# conf 结构变更时须同批更新本模板。勿移入 configs/：该目录会被
# Kratos file source 整体加载，模板与运行配置必须分离。
# 密钥项保持 ${ENV:default} 占位，由 Kratos 加载时展开，本模板不做替换。
server:
  http:
    addr: 0.0.0.0:8000
    # SSE 治理：全局超时归零，避免 Kratos 入站 filter 的 WithTimeout 截断
    # AG-UI 长流（SSE 写循环监听请求 ctx.Done，1s 即断）。普通路由的请求
    # 超时由 server 层的路由级超时中间件按 http.request_timeout 恢复；
    # AG-UI / ack 前缀路径跳过该中间件，运行时长由 agent.agui.timeout 兜底。
    timeout: 0s
    # 非 agent 路由的请求超时（覆盖生成代码端点与未来手写端点）。
    request_timeout: 1s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 1s
  # trace：可信上游网段。仅这些来源的合法 traceparent 被继承，否则剥头新建根。
  trace:
    trusted_networks:
      - 127.0.0.1/32
      - ::1/128
data:
  database:
    # 槽位按用途分层：master 业务主库、system 系统库。过渡期各槽指向
    # 同一实例，DSN 收敛到 data.database.<用途>.source。
    master:
      # 运行角色 grape_u（非超级用户，真实承受 RLS；授权见 sqlc/rls.sql）。
      # 指向已按仓库根 deploy_db.md 完成部署的库。
      source: ${DATABASE_SOURCE:postgres://grape_u:grape_u_pwd@127.0.0.1:5432/grape}
      # Log every executed statement. Development only.
      debug: true
    system:
      # 过渡期与 master 同实例；拆分时只改此处。
      source: ${DATABASE_SOURCE:postgres://grape_u:grape_u_pwd@127.0.0.1:5432/grape}
      debug: true
auth:
  # default_tenant_id：登录未指明租户时的回落租户（过渡策略，多租户
  # 登录形态确定后由服务端解析替代）。指向种子数据里的全租户管理员。
  default_tenant_id: t-super-01
agent:
  # app_name：core runner / AG-UI / ack 三者共用的会话存储键组成部分，
  # 三处必须一致，否则会话定位失败。
  app_name: grape-agent
  llm:
    # provider：OpenAI 兼容变体（openai / deepseek / qwen / minimax / kimi）；
    # base_url 留空时由框架按变体取内置默认端点。
    provider: openai
    base_url: ${AGENT_LLM_BASE_URL:}
    # api_key 只经环境变量注入，不落默认配置。
    api_key: ${AGENT_LLM_API_KEY:}
    model: ${AGENT_LLM_MODEL:gpt-4o-mini}
    # 单次模型调用超时；未设置用框架默认。
    timeout: 60s
  agui:
    # base_path：AG-UI 与 ack 的共同路由前缀；chat 在前缀根，
    # /history、/cancel 与 /ack/confirmations 同前缀。
    base_path: /agui
    # 单次运行超时（服务端兜底；将来未决确认最终由它结算为拒绝）。
    timeout: 1800s
    # SSE 心跳间隔，保持中间设备不掐空闲流。
    heartbeat_interval: 15s
  # session_storage：会话存储（框架 session/postgres，schema agent +
  # agent_ 表前缀）保留策略。0 值语义见 conf.proto 注释：session/app/user
  # state 的 0 = 永不过期；track 事件的 0 = 沿用 session_ttl。
  # grape 不用 app 级 state 存租户业务数据（设施面例外，见
  # internal/README.md agent 层说明）。
  session_storage:
    session_ttl: 0s
    track_event_ttl: 0s
    app_state_ttl: 0s
    user_state_ttl: 0s
  # compression：请求侧上下文压缩（TODO §1.1）。压缩只作用于请求投影
  # 副本，session 事件流始终保留原文；占位符带 event_id，模型可经
  # session_load 取回片段。0 值语义：tool_result_max_tokens 与
  # keep_recent_requests 取框架默认（1024 / 1），
  # oversized_tool_result_max_tokens 为关闭（框架推荐 8192 仅是参考）。
  compression:
    enabled: false
    tool_result_max_tokens: 0
    keep_recent_requests: 0
    oversized_tool_result_max_tokens: 0
    force_clean_tool_names: []
    keep_tool_names: []
  # summarization：会话摘要配置位，当前恒关闭（启用需 summarizer 模型
  # 与注入模式选型，B2 未实现）。
  summarization:
    enabled: false
