                    description: 实际新增的映射条数（目标用户已拥有的角色跳过）。
            description: AssignRolesReply 是 UserService.AssignRoles 的输出。
        user.v1.AssignRolesRequest:
            required:
                - userId
                - roleIds
            type: object
            properties:
                userId:
                    type: string
                    description: 被分配的目标用户。
                roleIds:
                    type: array
                    items:
                        type: string
                    description: 要分配的角色列表；重复项去重。
            description: AssignRolesRequest 是 UserService.AssignRoles 的输入。
        user.v1.CreateUserRequest:
            required:
                - user
                - password
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/user.v1.User'
                    description: 要创建的用户。id、created_by/updated_by 与时间戳在输入中被忽略。
                password:
                    type: string
                    description: 初始密码。仅存储，不出现在任何读接口的响应中。
            description: CreateUserRequest 是 UserService.CreateUser 的输入。
        user.v1.SetUserPasswordRequest:
            required:
                - id
                - password
            type: object
            properties:
                id:
                    type: string
                    description: 目标用户的服务端标识。
                password:
                    type: string
                    description: 新密码。
            description: SetUserPasswordRequest 是 UserService.SetUserPassword 的输入。
        user.v1.TransferUserOwnerRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: 目标用户的服务端标识。
                ownerUserId:
                    type: string
                    description: 新归属用户；null 表示清掉该归属。
                ownerDeptId:
                    type: string
                    description: 新归属部门；null 表示清掉该归属。
                ownerUserGroupId:
                    type: string
                    description: 新归属用户组；null 表示清掉该归属。
            description: TransferUserOwnerRequest 是 UserService.TransferUserOwner 的输入。
        user.v1.User:
            type: object
            properties:
                id:
                    type: string
                    description: 服务端生成的标识。只读。
                status:
                    type: integer
                    description: 数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                    format: int32
                name:
                    type: string
                    description: 用户名，租户内唯一。
                nickname:
                    type: string
                    description: 昵称。
                email:
                    type: string
                    description: 邮箱，租户内唯一，可空。
                phone:
                    type: string
                    description: 手机号，租户内唯一，可空。
                remark:
                    type: string
                    description: 备注，可空。
                locale:
                    type: string
                    description: 语言偏好（BCP-47），如 zh-CN。缺省 zh-CN。
                ownerUserId:
                    type: string
                    description: 归属用户。读接口可见，仅 TransferUserOwner 可写。
                ownerDeptId:
                    type: string
                    description: 归属部门。读接口可见，仅 TransferUserOwner 可写。
                ownerUserGroupId:
                    type: string
                    description: 归属用户组。读接口可见，仅 TransferUserOwner 可写。
                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。服务端生成，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。服务端生成，只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间，通常为空。只读。
                    format: date-time
            description: |-
                User 是用户的规范表示。password 列为 @internal，不跨越 API 边界；
                 审计列与时间戳只读。
        user.v1.UserSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/user.v1.User'
                    description: 本页用户，顺序遵循查询中的 sort。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现。
                hasMore:
                    type: boolean
                    description: 是否还有后续页。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0。
                    format: int32
            description: UserSet 是 ListUsers 返回的分页集合。
tags:
    - name: DeptService
      description: |-
        DeptService 提供部门管理。组织树是租户内资源：租户边界由数据库 RLS
         强制，租户内全部部门对持有令牌的成员可见（表无 @scope，行级无范围）。
         List 走动态查询协议，过滤/排序/投影/分页能力由存储层 schema 注释 DSL
         声明。闭包表 sys_dept_closure 是派生数据，由数据库触发器随部门增删改
         自动维护（校验父级/防环/软删等价删除），不跨越 API 边界。
    - name: SessionService
      description: |-
        SessionService 提供登录与会话令牌生命周期。令牌是随机不透明值，
         不含租户/用户信息，身份事实以服务端会话记录为准；访问令牌走
         `Authorization: Bearer` 头传输，不走 cookie。
    - name: UserService
      description: |-
        UserService 提供用户管理。List 走动态查询协议，过滤/排序/投影/分页
         能力由存储层 schema 注释 DSL 声明。读写都在服务端注入的租户与数据
         范围内执行（@scope 守卫）：范围不可见的数据等同不存在（NOT_FOUND），
         写侧判定不通过返回 FORBIDDEN。
