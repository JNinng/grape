                        $ref: '#/components/schemas/org.v1.DeptTreeNode'
                    description: |-
                        根节点集合（parent_id 为空的部门）；无根节点时键省略（空集合不输出），
                         客户端按空数组处理。
                total:
                    type: string
                    description: |-
                        树内节点总数（= 租户内未删除部门数），供前端提示。为零时 JSON 响应键
                         省略。
            description: DeptTreeReply 是 DeptService.GetDeptTree 的输出。
        org.v1.MoveDeptRequest:
            required:
