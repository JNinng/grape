            description: CreateDeptRequest 是 DeptService.CreateDept 的输入。
        org.v1.CreateUserGroupRequest:
            required:
                - group
            type: object
            properties:
                group:
                    allOf:
                        - $ref: '#/components/schemas/org.v1.UserGroup'
                    description: 要创建的用户组。id、created_by/updated_by 与时间戳在输入中被忽略。
            description: CreateUserGroupRequest 是 UserGroupService.CreateUserGroup 的输入。
        org.v1.Dept:
            type: object
            properties:
                id:
                    type: string
                    description: 服务端生成的标识。只读。
                status:
                    type: integer
                    description: 数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                    format: int32
                name:
                    type: string
                    description: 部门名，租户内未删除部门间唯一。
                parentId:
                    type: string
                    description: |-
                        父部门 ID；根部门为 null。创建与更新时生效：更新即移动（校验父级与
                         防环，闭包路径由触发器重写）；专用移动入口 MoveDept 语义相同。
                ownerUserId:
                    type: string
                    description: 部门管理员用户 ID，创建与更新均必填。
                ownerUserGroupId:
                    type: string
                    description: 归属用户组 ID，可空。创建与更新时生效；更新传 null 表示清空该归属。
                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。服务端生成，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。服务端生成，只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间，通常为空。只读。
                    format: date-time
            description: Dept 是部门的规范表示。审计列与时间戳只读；闭包路径不出现在任何接口。
        org.v1.DeptSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.Dept'
                    description: 本页部门，顺序遵循查询中的 sort；零命中时键省略（空集合不输出），客户端按空数组处理。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现，JSON 响应中未设置时键省略。
                hasMore:
                    type: boolean
                    description: 是否还有后续页；JSON 响应中为 false 时键省略，客户端按 false 处理。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空，JSON 响应中为空串时键省略。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0，JSON 响应中为 0 时键省略。
                    format: int32
            description: DeptSet 是 ListDepts 返回的分页集合。
        org.v1.DeptTreeNode:
            type: object
            properties:
                dept:
                    allOf:
                        - $ref: '#/components/schemas/org.v1.Dept'
                    description: 本节点的部门。
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/org.v1.DeptTreeNode'
                    description: 直接子节点；无子节点时键省略（空集合不输出），客户端按空数组处理。
            description: |-
                DeptTreeNode 是 GetDeptTree 返回的树节点：部门与其子树。children 按部门
                 创建时间升序排列（同刻按 id 升序），与叶子平铺顺序一致。
        org.v1.DeptTreeReply:
            type: object
            properties:
                roots:
