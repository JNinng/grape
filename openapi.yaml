            tags:
                - UserService
            description: |-
                UpdateMyProfile 覆盖当前认证用户的可编辑资料（昵称、邮箱、手机号、
                 备注、语言）。用户名、状态、归属三元组与时间戳不由本接口写入。
            operationId: UserService_UpdateMyProfile
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.UpdateMyProfileRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.User'
    /v1/profile/password:
        post:
            tags:
                - UserService
            description: |-
                ChangeMyPassword 校验当前口令后替换为新口令（服务端哈希后落库）。
                 当前口令不匹配返回 INVALID_ARGUMENT，不触发会话失效。
            operationId: UserService_ChangeMyPassword
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.ChangeMyPasswordRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/query/schema:
        get:
            tags:
                - QueryService
            description: |-
                GetListSchema 返回资源的 List 能力 schema（字段、操作符、排序、分页配置）。
                 请求的资源未收录时返回 INVALID_ARGUMENT。
            operationId: QueryService_GetListSchema
            parameters:
                - name: resource
                  in: query
                  description: 资源名（存储表名，如 sys_user）。仅收录已暴露动态 List 的资源。
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/query.v1.ListSchema'
    /v1/roles/create:
        post:
            tags:
                - RoleService
            description: |-
                CreateRole 创建角色。租户内 code 与 name 各自唯一（未删除角色间），
                 冲突返回 ALREADY_EXISTS。role_type 由服务端定为租户自定义（2）；
                 data_scope 与 scope_dept_id 不在输入中生效（数据范围配置走
                 SetRoleDataScope，缺省 data_scope=1 仅本人）。
            operationId: RoleService_CreateRole
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/perm.v1.CreateRoleRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/perm.v1.Role'
    /v1/roles/list:
        post:
            tags:
                - RoleService
