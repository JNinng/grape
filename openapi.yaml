                    type: string
                    description: 前端路由路径，可空。
                component:
                    type: string
                    description: 前端组件路径，可空。
                permissionExpr:
                    type: string
                    description: 权限表达式（应用层匹配用），可空。
                sortOrder:
                    type: integer
                    description: 排序号，树内同级按其升序排列。为 0 时 JSON 响应键省略。
                    format: int32
                remark:
                    type: string
                    description: 备注，可空。
                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。服务端生成，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。服务端生成，只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间，通常为空。只读。
                    format: date-time
            description: Menu 是菜单/权限点的规范表示。审计列与时间戳只读。
        perm.v1.MenuTreeNode:
            type: object
            properties:
                menu:
                    allOf:
                        - $ref: '#/components/schemas/perm.v1.Menu'
                    description: 本节点菜单。
                children:
                    type: array
                    items:
                        $ref: '#/components/schemas/perm.v1.MenuTreeNode'
                    description: |-
                        直接子节点，顺序与平铺列表一致；无子节点时键省略（空集合不输出），
                         客户端按空数组处理。
            description: MenuTreeNode 是菜单树节点：菜单与其直接子节点。
        perm.v1.MenuTreeReply:
            type: object
            properties:
                roots:
                    type: array
                    items:
                        $ref: '#/components/schemas/perm.v1.MenuTreeNode'
                    description: |-
                        根节点集合（parent_id 为空的菜单，父引用缺失的行按根兜底挂载）；无根
                         节点时键省略（空集合不输出），客户端按空数组处理。
                total:
                    type: string
                    description: 树内节点总数（未删除菜单总数）。为零时 JSON 响应键省略。
            description: MenuTreeReply 是 GetMenuTree 返回的树形集合。
        perm.v1.MoveMenuSuperRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: 目标菜单的服务端标识。
                parentId:
                    type: string
                    description: |-
                        新父级菜单 ID；未设置表示移为根。引用的父菜单必须存在且未删除，
                         且不得位于被移动菜单的子树内（防环）。
            description: MoveMenuSuperRequest 是 MenuService.MoveMenuSuper 的输入。
        perm.v1.Role:
            type: object
            properties:
                id:
                    type: string
                    description: 服务端生成的标识。只读。
                status:
                    type: integer
                    description: |-
                        数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                         停用的角色失去分配资格与数据范围推导效力。
                    format: int32
                name:
                    type: string
                    description: 角色名，租户内未删除角色间唯一。
                code:
                    type: string
                    description: 角色编码，租户内未删除角色间唯一；创建后不可变。
                roleType:
                    type: integer
                    description: |-
                        角色类型：1 系统预置（不可删除）、2 租户自定义。服务端定值，
                         创建与更新输入中均被忽略。
                    format: int32
                dataScope:
                    type: integer
                    description: |-
                        数据范围规则：1-仅本人 2-本部门 3-本部门及子部门 4-指定人 5-指定部门
                         6-用户组 7-全租户。由 SetRoleDataScope 维护，创建与更新输入中被忽略。
                    format: int32
                scopeDeptId:
                    type: string
                    description: |-
                        组织可见范围（S）：NULL=仅全租户操作人可见；非 NULL=全租户操作人恒可见，
                         其余操作人须 S 落在其可见部门集合内且目标角色 data_scope 档位满足。分配侧
                         另受约束：NULL=全租户可分配，非 NULL=仅该部门及子部门可分配。
                         由 SetRoleDataScope 维护，输入中被忽略。
                remark:
                    type: string
                    description: 备注，可空。
                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。服务端生成，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。服务端生成，只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间，通常为空。只读。
                    format: date-time
            description: Role 是角色的规范表示。审计列与时间戳只读。
        perm.v1.RoleDataScope:
            type: object
            properties:
                roleId:
                    type: string
                    description: 所属角色 ID。
                dataScope:
                    type: integer
                    description: 数据范围规则：1-7，取值见 Role.data_scope。
                    format: int32
                scopeDeptId:
                    type: string
                    description: 组织可见范围（分配层级限定），可空。
                idScopes:
                    type: array
                    items:
                        $ref: '#/components/schemas/perm.v1.RoleIDScopeEntry'
                    description: ID 范围明细集合；无明细时键省略（空集合不输出），客户端按空数组处理。
                allowedDeptIds:
                    type: array
                    items:
                        type: string
                    description: |-
                        分发部门 ID 集合（升序）；无分发部门时键省略（空集合不输出），客户端
                         按空数组处理。
            description: |-
                RoleDataScope 是角色的数据范围配置视图。data_scope 决定 id_scopes 的
                 消费方式（4 指定人/5 指定部门/6 用户组分别只读对应 type 的明细）；
                 allowed_dept_ids 只参与角色分配判定（fn_can_assign_role），不影响
                 持有者的数据可见范围——用户最终数据边界由 data_scope 及其明细决定。
        perm.v1.RoleIDScopeEntry:
            type: object
            properties:
                type:
                    type: integer
                    description: |-
                        明细类型：1 用户 ID、2 部门 ID、3 用户组 ID。仅在角色 data_scope
                         为 4/5/6 时分别被数据范围推导消费，其余取值下为惰性配置。
                    format: int32
                dataId:
                    type: string
                    description: 指向的数据 ID。
            description: RoleIDScopeEntry 是数据范围明细条目：type 决定 data_id 的指向。
        perm.v1.RoleMenuSet:
            type: object
            properties:
                menuIds:
                    type: array
                    items:
                        type: string
                    description: |-
                        已授权菜单 ID，升序；无授权时键省略（空集合不输出），客户端按空数组
                         处理。
            description: |-
                RoleMenuSet 是角色当前的有效授权菜单 ID 集合（升序）：已停用/软删菜单
                 的残留映射不出现在本集合。
        perm.v1.RoleSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/perm.v1.Role'
                    description: 本页角色，顺序遵循查询中的 sort；零命中时键省略（空集合不输出），客户端按空数组处理。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现，JSON 响应中未设置时键省略。
                hasMore:
                    type: boolean
                    description: 是否还有后续页；JSON 响应中为 false 时键省略，客户端按 false 处理。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空，JSON 响应中为空串时键省略。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0，JSON 响应中为 0 时键省略。
                    format: int32
            description: RoleSet 是 ListRoles 返回的分页集合。
        perm.v1.SetRoleDataScopeRequest:
            required:
                - id
                - dataScope
            type: object
            properties:
                id:
                    type: string
                    description: 目标角色的服务端标识。
                dataScope:
                    type: integer
                    description: 数据范围规则：1-7。
                    format: int32
                scopeDeptId:
                    type: string
                    description: 组织可见范围（分配层级限定），可空；非空时引用的部门必须存在且启用。
                idScopes:
                    type: array
                    items:
                        $ref: '#/components/schemas/perm.v1.RoleIDScopeEntry'
                    description: |-
                        ID 范围明细集合；引用的用户/部门/用户组必须存在且启用，重复条目去重。
                         省略（键缺省）等同空集合，即清空明细。
                allowedDeptIds:
                    type: array
                    items:
                        type: string
                    description: |-
                        分发部门 ID 集合；引用的部门必须存在且启用，重复项去重。省略等同空
                         集合，即清空分发部门。
            description: SetRoleDataScopeRequest 是 RoleService.SetRoleDataScope 的输入。
        perm.v1.SetRoleMenusRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: 目标角色的服务端标识。
                menuIds:
                    type: array
                    items:
                        type: string
                    description: |-
                        目标授权菜单 ID 集合；空集合清空全部授权；重复项去重，引用的菜单
                         必须存在且启用。省略（键缺省）等同空集合。
            description: SetRoleMenusRequest 是 RoleService.SetRoleMenus 的输入。
        query.v1.Condition:
            type: object
            properties:
                field:
                    type: string
                    description: 字段键，小驼峰，如 createdAt。
                op:
                    type: string
                    description: |-
                        操作符：eq、neq、in、not_in、gt、gte、lt、lte、between、contains、
                         prefix、suffix、has、is_null、not_null。每列可用的操作符集合由 schema
                         声明并在服务端校验。
                value:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Value'
                    description: 左操作数（between 时为下界）。
                rightValue:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Value'
                    description: between 的上界。
            description: |-
                Condition 是单个过滤条件。

                 value 与 right_value 为 JSON 值，接受形态由字段数据类型与操作符决定：
                 整型字段的 eq 接受数字；between 在 value 放下界、right_value 放上界；
                 in / not_in 接受数组；is_null / not_null 不需要值。
        query.v1.ListSchema:
            type: object
            properties:
                resource:
                    type: string
                    description: 资源名（存储表名）。
                hash:
                    type: string
                    description: schema 内容 hash（确定性纯函数），可作 ETag 缓存协商。
                fields:
                    type: array
                    items:
                        $ref: '#/components/schemas/query.v1.ListSchemaField'
                    description: |-
                        可查询字段的能力列表；无字段时键省略（空集合不输出），客户端按空数组
                         处理。
                defaultSort:
                    type: array
                    items:
                        $ref: '#/components/schemas/query.v1.ListSchemaSort'
                    description: |-
                        默认排序；查询未指定 sort 时的服务端回落。无默认排序时键省略（空集合
                         不输出），客户端按空数组处理。
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/query.v1.ListSchemaPagination'
                    description: 分页参数。
            description: |-
                ListSchema 是动态 List 查询的能力契约，镜像存储层 dynq.ResourceSchema。
                 fields 是展示字段集合：非 @internal 且未被查询选项禁用的字段；visibility
                 为 hidden 的字段仍会出现（前端默认收起）。JSON 键统一小驼峰，与存储层
                 schema 的 JSON 协议一致。
        query.v1.ListSchemaField:
            type: object
            properties:
                field:
                    type: string
                    description: 字段键，小驼峰，与 Query.where/sort/fields 中的字段键一致。
                label:
                    type: string
                    description: 展示文本。
                dataType:
                    type: string
                    description: 数据类型：string / integer / decimal / boolean / date / datetime / enum 等。
                nullable:
                    type: boolean
                    description: 是否可空。false 时 JSON 响应键省略。
                sortable:
                    type: boolean
                    description: 是否可排序（sort 接受该字段）。false 时 JSON 响应键省略。
                visibility:
                    type: string
                    description: |-
                        前端列表初始显隐：always（固定显示、不可切换）/ optional（默认显示、
                         可切换；缺省）/ hidden（默认收起、可在列设置展开）。键始终存在。
                ops:
                    type: array
                    items:
                        type: string
                    description: |-
                        该字段可用的过滤操作符集合（eq、neq、in、not_in、gt、gte、lt、lte、
                         between、contains、prefix、suffix、has、is_null、not_null）。空集合时
                         键省略，客户端按空数组处理。
                enum:
                    type: array
                    items:
                        type: string
                    description: |-
                        枚举字段的合法线上枚举名。JSON 键为 enum；非枚举字段时键省略（空集合
                         不输出），客户端按空数组处理。
                api:
                    allOf:
                        - $ref: '#/components/schemas/query.v1.ListSchemaFieldAPI'
                    description: |-
                        选项数据源为远程接口的声明；为空表示选项取静态清单（enum 或
                         options）。未声明时 JSON 响应键省略。
                desc:
                    type: string
                    description: |-
                        字段描述（枚举值释义、单位说明等），镜像存储层 UI manifest 的 desc。
                         为空时 JSON 响应键省略。
                options:
                    type: array
                    items:
                        $ref: '#/components/schemas/query.v1.ListSchemaFieldOption'
                    description: |-
                        静态字典选项，镜像存储层 UI manifest 的 options，渲染下拉/多选值控件；
                         value 按字段 data_type 定型为 number 或 string。未声明时 JSON 响应键
                         省略（空集合不输出）。与 api 互斥：一个字段的选项只有一种来源。
            description: ListSchemaField 是单个查询字段的能力契约。
        query.v1.ListSchemaFieldAPI:
            type: object
            properties:
                endpoint:
                    type: string
                    description: 相对前端 baseURL 的路径；查询参数由前端按协议拼接。
                valueKey:
                    type: string
                    description: items 中选项值的字段名（顶层）。
                labelKey:
                    type: string
                    description: items 中展示文本的字段名（顶层）。
                mode:
                    type: string
                    description: 交互模式：single | multi | search。
            description: |-
                ListSchemaFieldAPI 是 UI manifest api 字段的选项数据源契约：where 值控件
                 的选项经 GET {endpoint} 拉取，响应 body 为 items 数组，每项含 value_key /
                 label_key 命名的顶层字段。

                 本声明只服务 query-filter 的字段级选项来源；用户分配选择器使用的
                 OptionQuery / Option / OptionSet 是并行的独立接口，不接入本字段
                 （选择器端点按分配动作设权限码，不复用动态查询的选项源解析）。
        query.v1.ListSchemaFieldOption:
            type: object
            properties:
                value:
                    allOf:
                        - $ref: '#/components/schemas/google.protobuf.Value'
                    description: |-
                        选项值，仅整数或字符串，与字段 data_type 定型一致；整数按 JSON
                         number 表达，限制在 JS 安全整数范围内。
                label:
                    type: string
                    description: 选项展示文本。
            description: ListSchemaFieldOption 是静态字典选项的单个键值对。
        query.v1.ListSchemaPagination:
            type: object
            properties:
                defaultPageSize:
                    type: integer
                    description: 每页默认条数。
                    format: int32
                maxPageSize:
                    type: integer
                    description: 每页最大条数。
                    format: int32
                modes:
                    type: array
                    items:
                        type: string
                    description: 支持的分页模式：offset、cursor。空集合时键省略，客户端按空数组处理。
                includeTotal:
                    type: boolean
                    description: 是否支持 include_total=false 跳过 COUNT。false 时 JSON 响应键省略。
            description: ListSchemaPagination 是分页双模式与 total 计算能力。
        query.v1.ListSchemaSort:
            type: object
            properties:
                field:
                    type: string
                    description: 字段键，小驼峰。
                desc:
                    type: boolean
                    description: true = desc。false 时 JSON 响应键省略。
            description: ListSchemaSort 是默认排序项。
        query.v1.Option:
            type: object
            properties:
                value:
                    type: string
                    description: 选项值；当前来源均为 int64 ID 的十进制字符串。
                label:
                    type: string
                    description: 展示文本。
                enabled:
                    type: boolean
                    description: 是否可选；v1 恒 true。
                reason:
                    type: string
                    description: enabled=false 时的原因说明；v1 为空。
                assigned:
                    type: boolean
                    description: 目标用户已拥有（角色场景）；owner 候选恒 false。
            description: |-
                Option 是选择器候选项。当前来源的 value 均为 int64 ID 的十进制字符串
                 （前端不丢精度）；enabled/reason 为前向兼容字段，v1 恒 enabled=true、
                 reason 为空。
        query.v1.OptionQuery:
            type: object
            properties:
                keyword:
                    type: string
                    description: 关键字；空串不过滤。大小写不敏感的子串匹配。
                page:
                    type: integer
                    description: 页码，从 1 开始；缺省 1。
                    format: int32
                pageSize:
                    type: integer
                    description: 每页条数；缺省 20，上限 100。
                    format: int32
            description: |-
                OptionQuery 是可搜索选项来源的查询输入：关键字 + offset 分页。匹配字段
                 由来源定义（角色匹配 name/code，用户匹配 name/nickname，部门匹配 name，
                 用户组匹配 name/code）；越界分页由服务端归一化。
        query.v1.OptionSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/query.v1.Option'
                    description: 本页候选项；零命中时键省略（空集合不输出），客户端按空数组处理。
                hasMore:
                    type: boolean
                    description: 是否还有后续页。
                total:
                    type: string
                    description: 匹配总数；v1 不使用。
                page:
                    type: integer
                    description: 当前页码；服务端归一化后的值。
                    format: int32
            description: |-
                OptionSet 是选项来源的一页结果。total v1 不返回（以 limit+1 判定
                 has_more），保留字段供未来来源使用。
        query.v1.Pagination:
            type: object
            properties:
                page:
                    type: integer
                    description: 页码，从 1 开始。offset 模式。
                    format: int32
                pageSize:
                    type: integer
                    description: 每页条数。未设置时回落到表级默认值；上限受表级最大值约束。
                    format: int32
                after:
                    type: string
                    description: 上一页响应的 next_cursor。游标模式；与 page 互斥。
                includeTotal:
                    type: boolean
                    description: 是否计算 total。缺省为 true。
            description: |-
                Pagination 是分页输入。page 从 1 开始，为 offset 模式；after 非空即切换到
                 游标模式，且必须携带同表上一页返回的 next_cursor。游标按表做指纹校验，
                 跨资源的游标会被拒绝。
        query.v1.Query:
            type: object
            properties:
                fields:
                    type: array
                    items:
                        type: string
                    description: |-
                        投影字段列表（小驼峰）。显式空数组、@internal 字段、被禁用字段与未知字段
                         均被拒绝；pk 与表级默认排序键会强制并入查询结果。
                where:
                    type: array
                    items:
                        $ref: '#/components/schemas/query.v1.Condition'
                    description: 过滤条件，多条之间恒为 AND。
                sort:
                    type: array
                    items:
                        $ref: '#/components/schemas/query.v1.SortItem'
                    description: 排序项，按顺序生效；为空时回落到表级默认排序。
                pagination:
                    allOf:
                        - $ref: '#/components/schemas/query.v1.Pagination'
                    description: 分页输入。
            description: |-
                Query 是动态 List 查询协议，镜像存储层的 dynq.Query。
                 where 中多条条件恒为 AND 组合，不支持 OR 与条件分组。
        query.v1.SortItem:
            type: object
            properties:
                field:
                    type: string
                    description: 字段键，小驼峰。仅 schema 声明 sortable 的字段被接受。
                order:
                    type: string
                    description: 排序方向：asc（默认）或 desc。
            description: SortItem 是单个排序项。
        session.v1.LoginReply:
            type: object
            properties:
                tokenType:
                    type: string
                    description: '令牌类型，固定 "Bearer"，经 Authorization: Bearer 头携带。'
                accessToken:
                    type: string
                    description: 明文访问令牌，仅本次响应返回。
                refreshToken:
                    type: string
                    description: 明文刷新令牌，仅本次响应返回；下一次轮换后失效。
                expiresAt:
                    type: string
                    description: 访问令牌过期时间（存储介质时钟）。
                    format: date-time
                user:
                    allOf:
                        - $ref: '#/components/schemas/session.v1.SessionUser'
                    description: 会话所属用户摘要。
            description: LoginReply 是登录/刷新的输出。
        session.v1.LoginRequest:
            required:
                - userName
                - password
            type: object
            properties:
                tenantId:
                    type: string
                    description: 租户 ID。为空时回落服务端默认租户（默认租户由装配层配置注入）。
                userName:
                    type: string
                    description: 用户名，租户内唯一。
                password:
                    type: string
                    description: 明文口令，仅用于本次校验，不落日志。
                deviceInfo:
                    type: string
                    description: 登录设备信息（OS/浏览器/型号等），由客户端声明。
                ipAddress:
                    type: string
                    description: 登录来源 IP，由客户端声明。
            description: LoginRequest 是 SessionService.Login 的输入。
        session.v1.LogoutReply:
            type: object
            properties: {}
            description: |-
                LogoutReply 是 SessionService.Logout 的输出：无字段。幂等语义下
                 令牌已撤销或无对应会话时同样返回空响应。
        session.v1.LogoutRequest:
            type: object
            properties: {}
            description: |-
                LogoutRequest 是 SessionService.Logout 的输入：无请求体字段，访问
                 令牌经 Authorization: Bearer 头携带，不经请求体。
        session.v1.RefreshRequest:
            required:
                - refreshToken
            type: object
            properties:
                refreshToken:
                    type: string
                    description: 明文刷新令牌，仅用于本次轮换。
            description: RefreshRequest 是 SessionService.Refresh 的输入。
        session.v1.SessionUser:
            type: object
            properties:
                id:
                    type: string
                    description: 用户 ID。
                tenantId:
                    type: string
                    description: 会话归属租户。
                name:
                    type: string
                    description: 用户名。
                nickname:
                    type: string
                    description: 昵称。
            description: SessionUser 是登录响应中的用户摘要。
        tenant.v1.CreateTenantSuperRequest:
            required:
                - tenant
            type: object
            properties:
                tenant:
                    allOf:
                        - $ref: '#/components/schemas/tenant.v1.Tenant'
                    description: |-
                        要创建的租户。id、tenant_id、parent_id 的缺省展开（parent 省略时
                         取调用方租户）、created_by/updated_by 与时间戳由服务端落值。
            description: CreateTenantSuperRequest 是 TenantService.CreateTenantSuper 的输入。
        tenant.v1.Tenant:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        服务端生成的租户标识（字符串，`t-` + 14 位小写十六进制，共 16
                         字符）。只读。
                status:
                    type: integer
                    description: 数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                    format: int32
                code:
                    type: string
                    description: |-
                        租户编码（未删除行间唯一），如 default、demo；身份列，创建后
                         不可变（更新输入中被忽略）。
                name:
                    type: string
                    description: 租户名（未删除行间唯一）；更新可改。
                parentId:
                    type: string
                    description: |-
                        父级租户 ID。创建时可省略（缺省 = 调用方租户）或显式等于调用方
                         租户；其它值返回 INVALID_ARGUMENT（结构父级与行归属必须一致）。
                         创建后不可变，更新输入中被忽略。
                contactName:
                    type: string
                    description: 联系人，可空。
                contactPhone:
                    type: string
                    description: 联系电话，可空。
                expiredAt:
                    type: string
                    description: 到期时间，可空（未设置表示不过期）。
                    format: date-time
                maxUserCount:
                    type: integer
                    description: 最大用户数，可空（未设置表示不限制）；提供时必须 >0。
                    format: int32
                defaultLocale:
                    type: string
                    description: 租户默认语言（BCP-47 基本形态，如 zh-CN、en-US）；空则缺省 zh-CN。
                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。服务端生成，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。服务端生成，只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间，通常为空。只读。
                    format: date-time
                tenantId:
                    type: string
                    description: |-
                        行的归属父租户。只读：由服务端按认证身份的租户落值，请求中的值被
                         忽略；创建时与 parent_id 一致（恒等于调用方租户）。租户树根行
                        （id = tenant_id）的该列等于自身 id。
            description: Tenant 是租户实体的规范表示。审计列与时间戳只读。
        tenant.v1.TenantSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/tenant.v1.Tenant'
                    description: 本页租户，顺序遵循查询中的 sort；零命中时键省略（空集合不输出），客户端按空数组处理。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现，JSON 响应中未设置时键省略。
                hasMore:
                    type: boolean
                    description: 是否还有后续页；JSON 响应中为 false 时键省略，客户端按 false 处理。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空，JSON 响应中为空串时键省略。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0，JSON 响应中为 0 时键省略。
                    format: int32
            description: TenantSet 是 ListTenantsSuper 返回的分页集合。
        user.v1.AssignRolesReply:
            type: object
            properties:
                added:
                    type: string
                    description: 实际新增的映射条数（目标用户已拥有的角色跳过）。
            description: AssignRolesReply 是 UserService.AssignRoles 的输出。
        user.v1.AssignRolesRequest:
            required:
                - userId
                - roleIds
            type: object
            properties:
                userId:
                    type: string
                    description: 被分配的目标用户。
                roleIds:
                    type: array
                    items:
                        type: string
                    description: 要分配的角色列表；重复项去重。
            description: AssignRolesRequest 是 UserService.AssignRoles 的输入。
        user.v1.ChangeMyPasswordRequest:
            required:
                - oldPassword
                - newPassword
            type: object
            properties:
                oldPassword:
                    type: string
                    description: 当前口令，仅本次校验使用。
                newPassword:
                    type: string
                    description: 新口令，服务端哈希后落库。
            description: ChangeMyPasswordRequest 是 UserService.ChangeMyPassword 的输入。
        user.v1.CreateUserRequest:
            required:
                - user
                - password
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/user.v1.User'
                    description: 要创建的用户。id、created_by/updated_by 与时间戳在输入中被忽略。
                password:
                    type: string
                    description: 初始密码。仅存储，不出现在任何读接口的响应中。
            description: CreateUserRequest 是 UserService.CreateUser 的输入。
        user.v1.ListAssignableRolesRequest:
            required:
                - targetUserId
            type: object
            properties:
                targetUserId:
                    type: string
                    description: 目标用户的服务端标识（决定可分配角色集与已拥有过滤）。
                query:
                    allOf:
                        - $ref: '#/components/schemas/query.v1.OptionQuery'
                    description: 关键字与分页。
            description: ListAssignableRolesRequest 是 UserService.ListAssignableRoles 的输入。
        user.v1.ListOwnerOptionsRequest:
            type: object
            properties:
                query:
                    allOf:
                        - $ref: '#/components/schemas/query.v1.OptionQuery'
                    description: 关键字与分页。
            description: ListOwnerOptionsRequest 是归属候选三端点的输入。
        user.v1.SetUserPasswordRequest:
            required:
                - id
                - password
            type: object
            properties:
                id:
                    type: string
                    description: 目标用户的服务端标识。
                password:
                    type: string
                    description: 新密码。
            description: SetUserPasswordRequest 是 UserService.SetUserPassword 的输入。
        user.v1.SetUserRolesRequest:
            required:
                - userId
                - expectedVersion
            type: object
            properties:
                userId:
                    type: string
                    description: 目标用户的服务端标识。
                roleIds:
                    type: array
                    items:
                        type: string
                    description: 只表达调用方可管理范围内的目标集合；不得包含 locked 角色。
                expectedVersion:
                    type: string
                    description: ListUserRoles 返回的 version；必填，不一致返回 409。
            description: SetUserRolesRequest 是 UserService.SetUserRoles 的输入。
        user.v1.TransferUserOwnerRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: 目标用户的服务端标识。
                ownerUserId:
                    type: string
                    description: 新归属用户；null 表示清掉该归属。
                ownerDeptId:
                    type: string
                    description: 新归属部门；null 表示清掉该归属。
                ownerUserGroupId:
                    type: string
                    description: 新归属用户组；null 表示清掉该归属。
            description: TransferUserOwnerRequest 是 UserService.TransferUserOwner 的输入。
        user.v1.UpdateMyProfileRequest:
            type: object
            properties:
                nickname:
                    type: string
                    description: 昵称，必填。
                email:
                    type: string
                    description: 邮箱，可空；空表示清空。
                phone:
                    type: string
                    description: 手机号，可空；空表示清空。
                remark:
                    type: string
                    description: 备注，可空；空表示清空。
                locale:
                    type: string
                    description: 语言偏好（BCP-47）；缺省 zh-CN。
            description: |-
                UpdateMyProfileRequest 是 UserService.UpdateMyProfile 的输入：覆盖语义，
                 email/phone/remark 缺省或空串表示清空。
        user.v1.User:
            type: object
            properties:
                id:
                    type: string
                    description: 服务端生成的标识。只读。
                status:
                    type: integer
                    description: 数据状态：0 禁用、1 启用。创建时可省略（缺省启用）；更新时必填。
                    format: int32
                name:
                    type: string
                    description: 用户名，租户内唯一。
                nickname:
                    type: string
                    description: 昵称。
                email:
                    type: string
                    description: 邮箱，租户内唯一，可空。
                phone:
                    type: string
                    description: 手机号，租户内唯一，可空。
                remark:
                    type: string
                    description: 备注，可空。
                locale:
                    type: string
                    description: 语言偏好（BCP-47），如 zh-CN。缺省 zh-CN。
                ownerUserId:
                    type: string
                    description: |-
                        归属用户。读接口可见，仅 CreateUser（经 fn_can_set_owner 校验）与
                         TransferUserOwner 可写。
                ownerDeptId:
                    type: string
                    description: |-
                        归属部门。读接口可见，仅 CreateUser（经 fn_can_set_owner 校验）与
                         TransferUserOwner 可写。
                ownerUserGroupId:
                    type: string
                    description: |-
                        归属用户组。读接口可见，仅 CreateUser（经 fn_can_set_owner 校验）与
                         TransferUserOwner 可写。
                createdBy:
                    type: string
                    description: 创建人。只读。
                updatedBy:
                    type: string
                    description: 更新人。只读。
                createdAt:
                    type: string
                    description: 创建时间。服务端生成，只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近修改时间。服务端生成，只读。
                    format: date-time
                deletedAt:
                    type: string
                    description: 软删除标记时间，通常为空。只读。
                    format: date-time
            description: |-
                User 是用户的规范表示。password 列为 @internal，不跨越 API 边界；
                 审计列与时间戳只读。
        user.v1.UserRoleSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/query.v1.Option'
                    description: 当前可管理范围的角色（assigned=true）；按名称、ID 稳定排序。
                unmanagedCount:
                    type: string
                    description: locked 角色数量（不在调用方管理范围的既有角色；不暴露明细）。
                version:
                    type: string
                    description: 含 user_id 与排序后可管理角色 ID 的 hash；提交 SetUserRoles 时原样回传。
            description: UserRoleSet 是 UserService.ListUserRoles / SetUserRoles 的输出。
        user.v1.UserSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/user.v1.User'
                    description: 本页用户，顺序遵循查询中的 sort；零命中时键省略（空集合不输出），客户端按空数组处理。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现，JSON 响应中未设置时键省略。
                hasMore:
                    type: boolean
                    description: 是否还有后续页；JSON 响应中为 false 时键省略，客户端按 false 处理。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空，JSON 响应中为空串时键省略。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0，JSON 响应中为 0 时键省略。
                    format: int32
            description: UserSet 是 ListUsers 返回的分页集合。
tags:
    - name: AuditService
      description: |-
        AuditService 提供审计日志的只读查询面：登录日志（sys_login_log）与操作
         日志（sys_operation_log）两表均为追加写入（append-only），本服务无任何
         写端点。两表是租户内公共数据：租户边界由数据库 RLS 强制，表无 @scope
         （行级无范围）；两级 List 都走动态查询协议，过滤/排序/投影/分页能力由
         存储层 schema 注释 DSL 声明。写面不在本服务：登录日志由登录用例在
         身份成立前追加（成功与失败尝试均记录），操作日志由入口操作审计中间件
         在认证之后追加（管理写请求与权限拒绝均入账）。
    - name: ConfigService
      description: |-
        ConfigService 提供系统全局配置（sys_config）的管理。sys_config 是
         平台级全局表：不绑定租户、无 tenant_id、不设 RLS，所有租户共享同一
         份配置。

         读写形态：读端点（GetConfig / ListConfigs）不设 super——表无行级范围，
         读取本身就是全局口径，租户边界不适用；写端点经部署面 SECURITY
         DEFINER 固定口径写函数（role.sql 已对 sys_config REVOKE 运行角色直写，
         函数内校验认证事务纪律），方法名按 permission.md 口径带 Super。

         平台信任边界：写权限不能只依赖调用者租户内的角色 → 菜单 → 权限码链
        （子租户被授予菜单/角色管理后可自造 sys:config:global:* 写码）；仅
         平台（根）租户可写，子租户即使持有权限码也拒绝（CONFIG_PLATFORM_REQUIRED，
         403）。读端点不受此限。

         身份/值语义列纪律：config_key 参与唯一约束（未删除行间唯一），
         value_type 是消费方的取值预处理声明（string/integer/boolean/float/
         json，库层无 CHECK，白名单收在用例入参校验）——两者创建后不可变，
         更新输入中被忽略。status 只允许 0（禁用）/1（启用），创建时缺省
         启用。删除为软删除，唯一约束限定未删除行间，软删后 config_key 可
         复用。
    - name: DeptService
      description: |-
        DeptService 提供部门管理。组织树是租户内资源：租户边界由数据库 RLS
         强制，租户内全部部门对持有令牌的成员可见（表无 @scope，行级无范围）。
         List 走动态查询协议，过滤/排序/投影/分页能力由存储层 schema 注释 DSL
         声明。闭包表 sys_dept_closure 是派生数据，由数据库触发器随部门增删改
         自动维护（校验父级/防环/软删等价删除），不跨越 API 边界。
    - name: DictService
      description: |-
        DictService 提供字典管理：字典类型（sys_dict_type）与字典数据
        （sys_dict_data）两级。字典是租户内公共数据：租户边界由数据库 RLS
         强制，租户内全部字典对持有令牌的成员可见（表无 @scope，行级无范围）。
         两级 List 都走动态查询协议，过滤/排序/投影/分页能力由存储层 schema
         注释 DSL 声明。

         身份列纪律：字典类型 code 与字典数据 value/value_type 参与唯一约束或
         值语义（同类型下 value 唯一、软删后可复用），创建后不可变，更新输入
         中被忽略；字典数据的宿主归属 dict_type_id 创建后不可变。字典类型删除
         为软删除，存在未删除字典数据时拒绝（先清空该类型下的数据）；删除数据
         不联动宿主，数据删除为软删除。
    - name: DocumentService
      description: |-
        DocumentService 管理知识条目（本期文本）。条目正文经切分、向量化后
         进入 Agent 检索；停用/未生效/已过期条目不出现在检索结果，向量不被
         自动删除。条目的读面随所属库的可见性收窄：库不可见与条目不存在统一
         404，不泄露条目存在性。
    - name: FeatureFlagService
      description: |-
        FeatureFlagService 提供功能开关（sys_feature_flag）的管理。功能开关是
         租户级资源：租户边界由数据库 RLS 强制，租户内全部开关对持有令牌的成员
         可见（表无 @scope，行级无范围）。

         读写形态：全部端点不设 super——写路径走普通 DML，RLS 承担租户边界
        （tenant_id 取会话 app.tenant_id，不取请求值）。

         身份语义列纪律：flag_key 在租户内未删除行间唯一（配合 tenant_id 形成
         组合唯一），创建后不可变，更新输入中被忽略。tenant_id 只读，由服务端
         落值。status 只允许 0/1，创建缺省启用；is_enabled 是功能开关的业务
         取值，创建时 optional 未设置即 false，显式设置按值落库。软删除后
         flag_key 可复用；跨租户目标由 RLS 天然不可见，等同不存在（NOT_FOUND）。
    - name: LibraryService
      description: |-
        LibraryService 管理租户内知识库与模型选项：知识库是条目的归类容器，
         租户边界由数据库 RLS 强制；租户内的库级可见性按归属三元组与调用方
         数据范围推导（不可见与不存在统一 404，不泄露存在性）。库级
         embedding_model_key 为空时跟随租户/全局默认嵌入模型；chunk_size/
         chunk_overlap/chunk_delimiter 决定条目切分参数。列表走动态查询协议，
         同样按数据范围过滤。
    - name: MenuService
      description: |-
        MenuService 提供菜单/权限点树的管理。sys_menu 承载功能权限码链的
         宿主树（角色 → 菜单 → 权限码，与数据范围正交），是功能入口表：
         运行角色对它只读（数据库直写已 REVOKE），写面经部署面 SECURITY
         DEFINER 固定口径写函数（租户边界复位、父级校验、防环、软删口径
         收在函数内）。

         读写形态：读端点（GetMenuTree / GetMenu）按权限默认处理——租户边界
         由 RLS 承担（表无 @scope，租户内全可见），方法名不带 super；写端点
         是有意绕过默认权限处理的受控写路径（SECURITY DEFINER 函数），按
         permission.md 口径在方法名带 super。

         软删除口径：菜单删除为软删除（deleted_at 置位），存在未删除直接
         子菜单时拒绝（自叶向根逐层删）；permission_code 在租户内未删除
         菜单间唯一，软删后可复用；已软删/停用菜单不再产生功能权限
         （fn_has_permission 活跃联结过滤），角色-菜单映射行物理残留、
         由 RoleService.SetMenus 的存在性判定排除。
    - name: ModelService
      description: |-
        ModelService 管理模型目录（sys_model 单表双态）：tenant_id='' 为平台行
         （所有租户可见、只读），非空为租户行并覆盖同 model_key 的平台行。
         租户行经普通端点维护；平台行只能经 super 端点维护（受控 SECURITY
         DEFINER 函数写入，入口层另以 sys:model:platform:* 权限码把守）。

         密钥纪律：apiKey 只写不读——接口响应只返回 hasApiKey，不返回密文或明文；
         更新时省略 apiKey 表示不变，clearApiKey=true 表示清除。嵌入模型本期
         只允许 1024 维。
    - name: PermissionService
      description: |-
        PermissionService 提供当前认证用户的功能权限码查询（前端导航过滤的
         数据源）。功能权限码与数据范围正交：只看角色 → 菜单 → 权限码这条链
         （fn_has_permission 同源推导），集合为空表示当前用户不持有任何权限码。
         本端点只受认证约束，不设权限码——权限码集合本身是用户界面的引导数据，
         入口层判定不应对它设门槛。
    - name: QueryService
      description: |-
        QueryService 提供动态 List 的能力 schema 出口：前端据此渲染查询组件。
         schema 是（生成期元数据，能力收窄选项）的确定性纯函数，同一资源恒产出
         字节级相同结果，内容 hash 可作 ETag。资源仅收录已暴露动态 List 的表；
         本服务为能力元数据读面，认证后即可访问，不设功能权限码。
    - name: RoleService
      description: |-
        RoleService 提供角色管理。角色是租户内资源：租户边界由数据库 RLS 强制，
         租户内全部角色对持有令牌的成员可见（表无 @scope，行级无范围）。List 走
         动态查询协议，过滤/排序/投影/分页能力由存储层 schema 注释 DSL 声明。

         数据范围是一组随角色读写的配置：sys_role.data_scope（1-7）与明细表
         sys_role_id_scope（type 1 用户/2 部门/3 用户组，分别只在 data_scope
         4/5/6 下被消费）与 sys_role_allowed_dept（分发部门，只参与角色分配判定，
         不影响持有者的数据可见范围）由 GetRoleDataScope / SetRoleDataScope 读写，
         设置为整组替换语义。角色-菜单授权（sys_role_menu）承载功能权限码链
         （角色 → 菜单 → 权限码，与数据范围正交），由 ListRoleMenus /
         SetRoleMenus 维护，解除授权走物理删除，整组设置为差量同步（保留行的
         授权人/授权时间不变）。

         软删除口径：角色删除为软删除（deleted_at 置位），code 与 name 的唯一
         约束限定未删除行间，软删后可复用；停用或软删的角色立即失去分配资格与
         数据范围推导效力（判定函数按 status=1 且未删除过滤），已分配的用户
         映射残留但不生效。系统预置角色（role_type=1）不可删除。
    - name: SessionAdminService
      description: |-
        SessionAdminService 提供会话管理面（治理面）：租户内会话列表（动态查询
         协议）与主动撤销。会话是租户内资源：租户边界由数据库 RLS 强制，表无
         @scope（行级无范围）。令牌哈希不进入任何端点（schema @internal，协议
         不可查、模型不携带）；撤销为幂等动作——目标不存在、已撤销或已被清理
         均按成功返回，不泄露会话存在性（与登出/认证撤销同口径）。撤销会使该
         会话的访问令牌与刷新令牌一并失效（is_revoked 置位后认证校验直接拒绝）。
    - name: SessionService
      description: |-
        SessionService 提供登录与会话令牌生命周期。令牌是随机不透明值，
         不含租户/用户信息，身份事实以服务端会话记录为准；访问令牌走
         `Authorization: Bearer` 头传输，不走 cookie。
    - name: TenantConfigService
      description: |-
        TenantConfigService 提供租户配置（sys_tenant_config）的管理。租户
         配置是租户级覆盖：租户边界由数据库 RLS 强制，租户内全部配置对持有
         令牌的成员可见（表无 @scope，行级无范围）。

         读写形态：全部端点不设 super——写路径走普通 DML，RLS 承担租户边界
        （tenant_id 取会话 app.tenant_id，不取请求值）。

         身份/值语义列纪律：config_key 在租户内未删除行间唯一（配合 tenant_id
         形成组合唯一），value_type 同全局配置口径；两者创建后不可变，更新
         输入中被忽略。tenant_id 只读，由服务端落值（请求中的值一律忽略）。
         status 只允许 0/1，创建时缺省启用。删除为软删除，软删后 config_key
         可复用；跨租户目标由 RLS 天然不可见，等同不存在（NOT_FOUND）。
    - name: TenantService
      description: |-
        TenantService 提供平台级租户实体（sys_tenant）的管理。

         租户树模型（schema/20_tenant.sql 的设计口径）：sys_tenant 的每一行
         归属其父租户（tenant_id 列），RLS 策略 sys_tenant_tenant_isolation
         允许命中 tenant_id = app.tenant_id 或 id = app.tenant_id 的行。每个
         租户可见并管理自己名下的直接子租户与自身；树外租户行由 RLS 天然
         不可见，等同不存在（NOT_FOUND）。租户树由各租户创建自己的直接子租户
         构成：结构父级（parent_id）与行归属（tenant_id）必须一致，创建时
         parent_id 只允许省略（缺省 = 调用方租户）或等于调用方租户。

         默认种子口径：种子只向平台根租户（t-super-01 的超级管理员角色 101）
         授予 sys:tenant:* 菜单/权限点；子租户如需自助管理其直接子租户，需
         另行在其租户内铺设菜单/角色（种子不铺）。

         super 命名口径：本服务 API 方法名统一带 Super，表达的是「平台级租户
         实体管理」——被管理的是一整个租户实体（而非调用方自己租户内的业务
         数据），与 permission.md 中「绕过租户/数据范围约束」的 super 语义不同。
         内部仓储的读方法（List/Get）不带 Super，写/状态方法带。租户边界仍由
         RLS 承担：除删除前置的受控只读计数函数（只返回计数，不返回行数据）外，
         本服务不新增 RLS 绕过机制、不新增 SECURITY DEFINER 写函数，写路径是
         普通 DML（role.sql 未对 sys_tenant REVOKE 直写授权）。

         身份/结构列纪律：id 由服务端生成（字符串），创建请求中的 id、
         tenant_id、审计列与时间戳被忽略；tenant_id 落值为会话
         app.tenant_id（行归属父租户，RLS WITH CHECK 兜底）。parent_id 创建时
         可省略（缺省 = 调用方租户）或显式等于调用方租户，创建后不可变，
         更新输入中被忽略。code 是身份列、name 是名称列：两者在未删除行间唯一
        （部分唯一索引，软删后可复用），code 创建后不可变（更新输入忽略），
         name 更新可改（冲突返回 ALREADY_EXISTS）。
    - name: TranslationService
      description: |-
        TranslationService 提供通用翻译（sys_translation）的管理。翻译是租户级
         资源：租户边界由数据库 RLS 强制，租户内全部翻译对持有令牌的成员可见
        （表无 @scope，行级无范围）。

         读写形态：全部端点不设 super——写路径走普通 DML，RLS 承担租户边界
        （tenant_id 取会话 app.tenant_id，不取请求值）。

         身份语义列纪律：table_name、row_id、column_name、locale 四列共同确定
         一条翻译（配合 tenant_id 形成组合唯一），均创建后不可变，更新输入中被
         忽略。value 是翻译文本本身：传输层原样透传；用例层落库前去除首尾空白
        （内部空白保留）并要求非空。locale 按 BCP-47 基本形态校验（如 zh-CN、
         en-US、ja-JP）。status 只允许 0/1，创建缺省启用。软删除后同一
        （table_name,row_id,column_name,locale）可复用；跨租户目标由 RLS 天然
         不可见，等同不存在（NOT_FOUND）。
    - name: UserGroupService
      description: |-
        UserGroupService 提供用户组管理。用户组是租户内资源：租户边界由数据库
         RLS 强制，租户内全部用户组对持有令牌的成员可见（表无 @scope，行级无
         范围）。List 走动态查询协议，过滤/排序/投影/分页能力由存储层 schema
         注释 DSL 声明。成员映射 sys_user_group_mapping 不单独立资源：随宿主
         用户组的管理面维护（成员列表/添加/移除），映射行无可变业务字段，移除
         成员走物理删除。组删除为软删除，映射行残留但权限推导侧全部联结组表
         deleted_at IS NULL 过滤，残留行不起作用。
    - name: UserService
      description: |-
        UserService 提供用户管理。List 走动态查询协议，过滤/排序/投影/分页
         能力由存储层 schema 注释 DSL 声明。读写都在服务端注入的租户与数据
         范围内执行（@scope 守卫）：范围不可见的数据等同不存在（NOT_FOUND），
         写侧判定不通过返回 FORBIDDEN。
