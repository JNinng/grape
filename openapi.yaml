                                $ref: '#/components/schemas/org.v1.UserGroupSet'
    /v1/user-groups/remove-members:
        post:
            tags:
                - UserGroupService
            description: |-
                RemoveUserGroupMembers 批量移除成员（物理删除映射行）。目标组必须
                 存在（NOT_FOUND）；移除非成员或已不存在的用户不算错误（幂等），
                 返回实际移除条数。
            operationId: UserGroupService_RemoveUserGroupMembers
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/org.v1.RemoveUserGroupMembersRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/org.v1.RemoveUserGroupMembersReply'
    /v1/user-groups/update:
        put:
            tags:
                - UserGroupService
            description: |-
                UpdateUserGroup 覆盖可变字段（name、status、remark）。code 与
                 owner_user_id 是身份/归属列，在输入中被忽略：组编码创建后不变，
                 组长变更走部署面专项口径（管理 API 不提供）。
            operationId: UserGroupService_UpdateUserGroup
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/org.v1.UserGroup'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/org.v1.UserGroup'
    /v1/user-groups/{id}:
        get:
            tags:
                - UserGroupService
            description: GetUserGroup 按 id 查询单个用户组。跨租户不可见等同不存在（NOT_FOUND）。
            operationId: UserGroupService_GetUserGroup
            parameters:
                - name: id
                  in: path
                  description: 目标用户组的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/org.v1.UserGroup'
        delete:
            tags:
                - UserGroupService
            description: |-
                DeleteUserGroup 软删除用户组（deleted_at 置位）。成员映射行随物理
                 保留：映射表无外键级联，残留行被权限推导与成员列表的组表/用户表
                 活跃过滤排除，不产生可见副作用；code 与 name 的唯一约束限定未删除
                 组间，软删后可复用。
            operationId: UserGroupService_DeleteUserGroup
            parameters:
                - name: id
                  in: path
                  description: 目标用户组的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/user-groups/{id}/members:
        get:
            tags:
                - UserGroupService
            description: |-
                ListUserGroupMembers 分页返回组成员（联结用户表展示姓名/昵称/状态，
                 按添加时间升序、user_id 升序稳定排序）。组不存在或跨租户返回
                 NOT_FOUND；已软删用户不出现在成员列表。
            operationId: UserGroupService_ListUserGroupMembers
            parameters:
                - name: id
                  in: path
                  description: 目标用户组的服务端标识。
                  required: true
                  schema:
                    type: string
                - name: page
                  in: query
                  description: 页码，缺省 1；小于 1 归一化为 1。
                  schema:
                    type: integer
                    format: int32
                - name: pageSize
                  in: query
                  description: 每页条数，缺省 20；上限 200，越界归一化为 200。
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/org.v1.UserGroupMemberSet'
    /v1/users/assign-roles:
        post:
            tags:
                - UserService
            description: |-
                AssignRoles 把多个角色分配给目标用户：先按 ID 锁定目标（不判可见性，
                 不存在返回 NOT_FOUND），再经库内批量判定（fn_can_assign_role：角色
                 可见性 + 目标部门范围 + 分配权限码），全部通过才写入映射；任一不通过
                 整批拒绝（FORBIDDEN）。已拥有的角色跳过，返回实际新增条数。
            operationId: UserService_AssignRoles
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.AssignRolesRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.AssignRolesReply'
    /v1/users/assignable-roles:
        post:
            tags:
                - UserService
            description: |-
                ListAssignableRoles 返回目标用户可分配、且尚未拥有的活跃角色
                （操作者按 fn_can_assign_role 判定：角色可见性 + 目标部门范围 +
                 分配权限码）。分配不要求目标用户可见；目标不存在/软删返回
                 NOT_FOUND。
            operationId: UserService_ListAssignableRoles
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.ListAssignableRolesRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/query.v1.OptionSet'
    /v1/users/create:
        post:
            tags:
                - UserService
            description: |-
                CreateUser 创建用户并设置初始密码（服务端哈希后落库）。
                 请求携带的归属三元组经库内 fn_can_set_owner 校验（归属对象存在、
                 启用且在操作者可见范围内），不通过返回 FORBIDDEN。
                 租户内 name/email/phone 唯一，冲突返回 ALREADY_EXISTS。
            operationId: UserService_CreateUser
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.CreateUserRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.User'
    /v1/users/list:
        post:
            tags:
                - UserService
            description: |-
                ListUsers 按动态查询协议返回一页用户。过滤表达式非法、字段未知、
                 操作符不允许、条件冲突、跨表游标均返回 INVALID_ARGUMENT。
            operationId: UserService_ListUsers
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/query.v1.Query'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.UserSet'
    /v1/users/owner-dept-options:
        post:
            tags:
                - UserService
            description: ListOwnerDeptOptions 返回归属部门候选（操作者可见范围内的活跃部门）。
            operationId: UserService_ListOwnerDeptOptions
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.ListOwnerOptionsRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/query.v1.OptionSet'
    /v1/users/owner-group-options:
        post:
            tags:
                - UserService
            description: ListOwnerGroupOptions 返回归属用户组候选（操作者可见范围内的活跃组）。
            operationId: UserService_ListOwnerGroupOptions
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.ListOwnerOptionsRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/query.v1.OptionSet'
    /v1/users/owner-user-options:
        post:
            tags:
                - UserService
            description: ListOwnerUserOptions 返回归属用户候选（操作者可见范围内的活跃用户）。
            operationId: UserService_ListOwnerUserOptions
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.ListOwnerOptionsRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/query.v1.OptionSet'
    /v1/users/password:
        post:
            tags:
                - UserService
            description: |-
                SetUserPassword 设置新密码（服务端哈希后落库）。
                 密码不出现在任何读接口的响应中。
            operationId: UserService_SetUserPassword
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.SetUserPasswordRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/users/set-roles:
        post:
            tags:
                - UserService
            description: |-
                SetUserRoles 用「管理范围内的整组替换」写入目标用户的角色：请求
                 只表达调用方可管理范围内的目标集合，范围外（locked）角色原样保留；
                 新增按 fn_can_assign_role 判定，移除按 fn_can_revoke_role 软删（放宽
                 角色/目标状态校验）；任一拒绝、请求触及 locked 或版本不一致整批
                 回滚。目标按 ID 定位（分配不要求目标可见），不存在返回 NOT_FOUND。
            operationId: UserService_SetUserRoles
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.SetUserRolesRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.UserRoleSet'
    /v1/users/transfer-owner:
        post:
            tags:
                - UserService
            description: |-
                TransferUserOwner 修改用户的归属三元组，两头校验：该用户本身
                 有权操作，且新归属的人/部门/组在可见范围内，否则 FORBIDDEN。
                 归属字段传 null 表示清掉该归属。
            operationId: UserService_TransferUserOwner
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.TransferUserOwnerRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.User'
    /v1/users/update:
        put:
            tags:
                - UserService
            description: |-
                UpdateUser 覆盖可变字段（name、nickname、email、phone、remark、
                 locale、status）。password、归属三元组与时间戳不由本接口写入。
            operationId: UserService_UpdateUser
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/user.v1.User'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.User'
    /v1/users/{id}:
        get:
            tags:
                - UserService
            description: GetUser 按 id 查询单个用户。数据范围不可见等同不存在。
            operationId: UserService_GetUser
            parameters:
                - name: id
                  in: path
                  description: 目标用户的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.User'
        delete:
            tags:
                - UserService
            description: DeleteUser 软删除用户（deleted_at 置位，租户内唯一键随之可复用）。
            operationId: UserService_DeleteUser
            parameters:
                - name: id
                  in: path
                  description: 目标用户的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content: {}
    /v1/users/{userId}/roles:
        get:
            tags:
                - UserService
            description: |-
                ListUserRoles 返回目标用户当前可管理范围的角色集合（locked 角色
                 只计数不暴露明细）与版本号；目标不存在/软删返回 NOT_FOUND
                （分配读面不要求目标可见）。
            operationId: UserService_ListUserRoles
            parameters:
                - name: userId
                  in: path
                  description: 目标用户的服务端标识。
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/user.v1.UserRoleSet'
components:
    schemas:
        audit.v1.LoginLog:
            type: object
            properties:
                id:
                    type: string
                    description: 日志 ID，自增序列。只读。
                userId:
                    type: string
                    description: 登录用户 ID。只读。
                username:
                    type: string
                    description: 用户名（写入时冗余快照，便于快速查看）。只读。
                ipAddress:
                    type: string
                    description: 登录 IP 地址，可空。只读。
                userAgent:
                    type: string
                    description: 浏览器/客户端 User-Agent，可空。只读。
                loginType:
                    type: string
                    description: 登录方式：password/sms/oauth/refresh_token。只读。
                isSuccess:
                    type: boolean
                    description: 是否登录成功。只读；false 时 JSON 响应键省略。
                failureReason:
                    type: string
                    description: 失败原因（成功时为空）。只读。
                loginAt:
                    type: string
                    description: 登录时间。只读。
                    format: date-time
                createdBy:
                    type: string
                    description: 创建人/操作用户。只读。
                createdAt:
                    type: string
                    description: 创建时间。只读。
                    format: date-time
            description: LoginLog 是登录日志的规范表示。全部字段只读（append-only，无更新面）。
        audit.v1.LoginLogSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/audit.v1.LoginLog'
                    description: 本页登录日志，顺序遵循查询中的 sort；零命中时键省略（空集合不输出），客户端按空数组处理。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现，JSON 响应中未设置时键省略。
                hasMore:
                    type: boolean
                    description: 是否还有后续页；JSON 响应中为 false 时键省略，客户端按 false 处理。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空，JSON 响应中为空串时键省略。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0，JSON 响应中为 0 时键省略。
                    format: int32
            description: LoginLogSet 是 ListLoginLogs 返回的分页集合。
        audit.v1.OperationLog:
            type: object
            properties:
                id:
                    type: string
                    description: 日志 ID，自增序列。只读。
                userId:
                    type: string
                    description: 操作用户 ID。只读。
                username:
                    type: string
                    description: 用户名（写入时冗余快照）。只读。
                operationType:
                    type: string
                    description: |-
                        操作类型：CREATE/UPDATE/DELETE/LOGIN/EXPORT/IMPORT/BATCH_DELETE 等。
                         只读。
                targetTable:
                    type: string
                    description: 操作目标表名，可空。只读。
                targetId:
                    type: string
                    description: 操作目标记录 ID，可空。只读。
                oldValue:
                    type: object
                    description: 操作前数据快照（JSON 对象），可空。只读。
                newValue:
                    type: object
                    description: 操作后数据快照（JSON 对象），可空。只读。
                ipAddress:
                    type: string
                    description: 请求 IP 地址，可空。只读。
                userAgent:
                    type: string
                    description: 浏览器/客户端 User-Agent，可空。只读。
                apiPath:
                    type: string
                    description: API 路径，可空。只读。
                httpMethod:
                    type: string
                    description: HTTP 方法：GET/POST/PUT/DELETE/PATCH，可空。只读。
                durationMs:
                    type: integer
                    description: 请求耗时（毫秒），可空。只读。
                    format: int32
                resultCode:
                    type: string
                    description: 结果码（200/400/403/404/500 等），可空。只读。
                resultMsg:
                    type: string
                    description: 结果消息，可空。只读。
                requestId:
                    type: string
                    description: 请求追踪 ID（关联同一请求的多个操作），可空。只读。
                operatedAt:
                    type: string
                    description: 操作时间。只读。
                    format: date-time
                createdBy:
                    type: string
                    description: 创建人/操作用户。只读。
                createdAt:
                    type: string
                    description: 创建时间。只读。
                    format: date-time
            description: |-
                OperationLog 是操作日志的规范表示。全部字段只读（append-only，无更新
                 面）；操作前后数据快照为 JSON 对象（写入时即校验合法性）。
        audit.v1.OperationLogSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/audit.v1.OperationLog'
                    description: 本页操作日志，顺序遵循查询中的 sort；零命中时键省略（空集合不输出），客户端按空数组处理。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现，JSON 响应中未设置时键省略。
                hasMore:
                    type: boolean
                    description: 是否还有后续页；JSON 响应中为 false 时键省略，客户端按 false 处理。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空，JSON 响应中为空串时键省略。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0，JSON 响应中为 0 时键省略。
                    format: int32
            description: OperationLogSet 是 ListOperationLogs 返回的分页集合。
        audit.v1.RevokeSessionRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                    description: 目标会话的租户内标识。
            description: RevokeSessionRequest 是 SessionAdminService.RevokeSession 的输入。
        audit.v1.SessionAdmin:
            type: object
            properties:
                id:
                    type: string
                    description: 会话 ID。只读。
                status:
                    type: integer
                    description: 数据状态：0 禁用、1 启用。只读；为 0 时 JSON 响应键省略。
                    format: int32
                userId:
                    type: string
                    description: 会话所属用户 ID。只读。
                expiresAt:
                    type: string
                    description: 访问令牌过期时间。只读。
                    format: date-time
                refreshExpiresAt:
                    type: string
                    description: 刷新令牌过期时间；未设置表示没有刷新令牌。只读。
                    format: date-time
                lastActivityAt:
                    type: string
                    description: 最近一次签发/刷新时间；校验为只读点查不刷新此列。可空。只读。
                    format: date-time
                deviceInfo:
                    type: string
                    description: 设备信息（OS/浏览器/型号等），可空。只读。
                ipAddress:
                    type: string
                    description: 登录来源 IP，可空。只读。
                isRevoked:
                    type: boolean
                    description: |-
                        是否已主动撤销：true 后即使令牌未过期也不可用。只读；false 时 JSON
                         响应键省略。
                createdBy:
                    type: string
                    description: 签发操作者（会话用户）。只读。
                updatedBy:
                    type: string
                    description: 最近一次变更的操作者（刷新为会话用户，撤销为调用者）。只读。
                createdAt:
                    type: string
                    description: 签发时间。只读。
                    format: date-time
                updatedAt:
                    type: string
                    description: 最近一次变更时间。只读。
                    format: date-time
            description: |-
                SessionAdmin 是会话管理面的规范表示。令牌哈希与租户 ID 不进入本消息
                （凭据不回显，租户边界由 RLS 承担）；全部字段只读，变更仅撤销一个动作。
        audit.v1.SessionAdminSet:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/audit.v1.SessionAdmin'
                    description: 本页会话，顺序遵循查询中的 sort；零命中时键省略（空集合不输出），客户端按空数组处理。
                total:
                    type: string
                    description: 匹配的总行数。include_total 设为 false 时不出现，JSON 响应中未设置时键省略。
                hasMore:
                    type: boolean
                    description: 是否还有后续页；JSON 响应中为 false 时键省略，客户端按 false 处理。
                nextCursor:
                    type: string
                    description: 游标模式下一页的游标；末页及无更多结果时为空，JSON 响应中为空串时键省略。
                page:
                    type: integer
                    description: offset 模式下的当前页码；游标模式下为 0，JSON 响应中为 0 时键省略。
                    format: int32
            description: SessionAdminSet 是 ListSessions 返回的分页集合。
        config.v1.Config:
            type: object
            properties:
                id:
                    type: string
                    description: 服务端生成的标识。只读。
