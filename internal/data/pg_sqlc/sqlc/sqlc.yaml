# grape 关系存储（pg_sqlc 能力）sqlc 配置：两个 sql 块共享同一组 schema 与 queries 文件。
# 块 1:sqlc-gen-go(built-in gen: go),产出模型与固定查询。
# 块 2:sqlc_gen_dynamic 插件(wasm 模式,锁定发布资产 v0.3.0),仅消费 Catalog 生成动态 List 与动态更新面;
#       queries 字段 sqlc 要求必填但插件忽略。
#
# 在 internal/data/pg_sqlc/sqlc 目录执行:sqlc generate -f sqlc.yaml
# sqlc 按 url 下载 wasm 并校验 sha256,首次生成后缓存于用户缓存目录。
#
# schema 与 queries 均按域拆分（单一事实源），按序号/清单全量加载；
# 文件/函数/命名查询索引见同目录 README.md；部署执行顺序见仓库根 deploy_db.md。
# 业务表固定 CRUD 一资源一文件（queries/<资源>.sql），随纵切补入清单。
version: "2"
plugins:
  - name: "sqlc_gen_dynamic"
    wasm:
      url: "https://github.com/JNinng/sqlc_gen_dynamic/releases/download/v0.3.0/sqlc_gen_dynamic-v0.3.0.wasm"
      sha256: "b5f4fe05a0ceef32ced5e720cff06f7d59c4710f8a4315d288b754222965b9c4"
    env:
      - "DYNQ_DUMP_REQUEST"
sql:
  - engine: "postgresql"
    schema:
      - "schema/10_basic.sql"
      - "schema/20_tenant.sql"
      - "schema/30_user.sql"
      - "schema/40_rbac.sql"
      - "schema/50_dept.sql"
      - "schema/60_dict.sql"
      - "schema/70_audit.sql"
      - "schema/80_session.sql"
      - "schema/90_config.sql"
      - "rls.sql"
      - "operate.sql"
      - "expose.sql"
    queries:
      - "queries/operate.sql"
      - "queries/basic.sql"
      - "queries/perm.sql"
      - "queries/sys_user.sql"
      - "queries/sys_session.sql"
    gen:
      go:
        package: "gen"
        out: "../gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true

  - engine: "postgresql"
    schema:
      - "schema/10_basic.sql"
      - "schema/20_tenant.sql"
      - "schema/30_user.sql"
      - "schema/40_rbac.sql"
      - "schema/50_dept.sql"
      - "schema/60_dict.sql"
      - "schema/70_audit.sql"
      - "schema/80_session.sql"
      - "schema/90_config.sql"
      - "rls.sql"
      - "operate.sql"
      - "expose.sql"
    queries:
      - "queries/operate.sql"
      - "queries/basic.sql"
      - "queries/perm.sql"
      - "queries/sys_user.sql"
      - "queries/sys_session.sql"
    codegen:
      - plugin: "sqlc_gen_dynamic"
        out: "../gen"
        options:
          package: "gen"
          runtime_import: "github.com/jninng/sqlc_gen_dynamic/dynq"
          schema: "public"
          default_ops: "none"
          page_default: 20
          page_max: 200
